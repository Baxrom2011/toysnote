<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toys Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============ ROOT — muted, professional palette ============ */
:root {
  --primary: #3B6EA8;
  --primary-light: #4A7DB8;
  --primary-dark: #2C5686;
  --secondary: #3F8F5C;
  --accent: #9C7A3C;
  --danger: #B5453A;
  --bg-start: #10161F;
  --bg-end: #151C27;
  --card-bg: #171F2B;
  --border: #2A3341;
  --text: #E6E9EE;
  --text-secondary: #9AA5B3;
  --text-muted: #6B7686;
  --radius: 8px;
  --shadow: 0 2px 10px rgba(0,0,0,0.2);
  --glass: #171F2B;
}

.glass {
  background: var(--card-bg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--radius);
  transition: border-color 0.2s ease;
}
.glass:hover { border-color: #37455A; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-start);
  color: var(--text);
  min-height: 100vh;
}

/* ============ LIGHT THEME ============ */
body.light {
  --bg-start: #F4F5F7;
  --bg-end: #EAEDF1;
  --text: #1E2530;
  --text-secondary: #556072;
  --text-muted: #8A93A3;
  --card-bg: #FFFFFF;
  --border: #DCE1E8;
  --shadow: 0 2px 8px rgba(20,30,50,0.06);
}
body.light .card{background:#FFFFFF;}
body.light input,body.light select{background:#FFFFFF;color:#1E2530;border-color:#D4D9E0;}
body.light .header{background:#FFFFFF;}
body.light .login-card{background:#FFFFFF;}
body.light .login-card input{background:#FFFFFF;color:#1E2530;}
body.light .nav button{color:#6B7686;}
body.light .nav button:hover{color:#1E2530;}
body.light .nav button.active{background:#EAF0F8;color:#3B6EA8;}
body.light .sale-box{background:#F7F8FA;border-color:#DCE1E8;}
body.light .sale-box .val{color:#1E2530;}
body.light .user-name{color:#1E2530;}
body.light .search-dropdown{background:#fff;}
body.light .modal-card{background:#fff;}
body.light .modal-card h3{color:#1E2530;}
body.light .badge{background:#EEF1F5;}
body.light .pill-ok{background:#E7F1EA;}
body.light .pill-debt{background:#F6E9E7;}

/* ============ CLASSIC THEME ============ */
body.classic {
  --bg-start: #F0EBE1;
  --bg-end: #E6DFD1;
  --text: #362A1E;
  --text-secondary: #6B5A46;
  --text-muted: #948066;
  --primary: #7A6142;
  --primary-light: #8B7355;
  --primary-dark: #5F4C34;
  --secondary: #3C4F45;
  --accent: #8C4E3B;
  --card-bg: #FAF6EE;
  --border: #DCD0BA;
  --shadow: 0 2px 8px rgba(90,70,40,0.06);
}
body.classic .card{background:#FAF6EE;}
body.classic input,body.classic select{background:#FAF6EE;color:#362A1E;border-color:#DCD0BA;}
body.classic .header{background:#FAF6EE;}
body.classic .login-card{background:#FAF6EE;}
body.classic .login-card input{background:#FAF6EE;color:#362A1E;}
body.classic .nav button{color:#6B5A46;}
body.classic .nav button:hover{color:#362A1E;}
body.classic .nav button.active{background:#EFE6D4;color:#7A6142;}
body.classic .sale-box{background:#F3ECDF;border-color:#DCD0BA;}
body.classic .sale-box .val{color:#362A1E;}
body.classic .user-name{color:#362A1E;}
body.classic .search-dropdown{background:#F0EBE1;}
body.classic .modal-card{background:#F0EBE1;}
body.classic .modal-card h3{color:#362A1E;}
body.classic .badge{background:#EFE6D4;}
body.classic .pill-ok{background:#E4E9E5;}
body.classic .pill-debt{background:#F0DFDA;}
body.classic .logo .brand{color:#5F4C34;}

*{margin:0;padding:0;box-sizing:border-box;}
.container{max-width:1200px;margin:0 auto;padding:16px;}

/* ============ HEADER ============ */
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.logo{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text);letter-spacing:0.01em;}
.logo .icon{font-size:18px;color:var(--text-secondary);}
.logo .brand{color:var(--text);}
.nav{display:flex;gap:4px;flex-wrap:wrap;}
.nav button{padding:6px 14px;border:none;border-radius:6px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:background 0.15s,color 0.15s;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;}
.nav button:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav button.active{background:rgba(59,110,168,0.14);color:#6FA0DA;border:1px solid rgba(59,110,168,0.2);}
.card{padding:18px;margin-bottom:14px;}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:768px){.grid{grid-template-columns:1fr;}}
input,select{width:100%;padding:9px 12px;border-radius:6px;border:1px solid var(--border);background:#101722;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;transition:border-color 0.15s;}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,110,168,0.15);}
label{display:block;color:var(--text-secondary);font-size:12px;font-weight:500;margin-bottom:4px;}
.btn{padding:8px 16px;border:1px solid transparent;border-radius:6px;font-weight:600;cursor:pointer;transition:background 0.15s,border-color 0.15s;font-size:13px;font-family:'Inter',sans-serif;}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-danger{background:rgba(181,69,58,0.1);color:#D07268;border-color:rgba(181,69,58,0.2);}
.btn-danger:hover{background:rgba(181,69,58,0.18);}
.btn-pay{background:rgba(63,143,92,0.1);color:#6FBE87;border-color:rgba(63,143,92,0.2);}
.btn-pay:hover{background:rgba(63,143,92,0.18);}
.btn-secondary{background:transparent;color:var(--text-secondary);border-color:var(--border);}
.btn-secondary:hover{background:rgba(255,255,255,0.03);color:var(--text);}
.btn-edit{background:rgba(156,122,60,0.1);color:#C7A467;border-color:rgba(156,122,60,0.2);}
.btn-edit:hover{background:rgba(156,122,60,0.18);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.02);color:var(--text-secondary);font-size:13px;}
tr:hover td{background:rgba(255,255,255,0.015);}
.pill{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;}
.pill-ok{background:rgba(63,143,92,0.12);color:#6FBE87;}
.pill-debt{background:rgba(181,69,58,0.12);color:#D07268;}
.badge{background:#1D2634;color:#8FAFD6;padding:2px 7px;border-radius:4px;font-size:11px;font-family:'SFMono-Regular',Consolas,monospace;border:1px solid var(--border);}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row .field{flex:1;min-width:120px;}
.loading{text-align:center;padding:40px;color:var(--text-muted);font-size:14px;}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg-start);}
.login-card{width:380px;max-width:100%;padding:32px;text-align:center;}
.login-card .logo-big{font-size:15px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:14px;}
.login-card h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;}
.login-card .subtitle{color:var(--text-secondary);font-size:13px;margin-bottom:18px;}
.login-error{background:rgba(181,69,58,0.1);color:#D07268;padding:10px;border-radius:6px;margin-bottom:14px;font-size:13px;text-align:left;}
.login-card .field input{background:#101722;border:1px solid var(--border);border-radius:6px;padding:11px 14px;color:var(--text);width:100%;font-size:14px;}
.login-card .field input:focus{outline:none;border-color:var(--primary);}
.login-card .field label{text-align:left;}

/* ============ TRANSITIONS ============ */
.fade{animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.welcome-text{font-size:17px;font-weight:600;color:var(--text);margin-top:10px;}

.sale-box{background:rgba(59,110,168,0.05);border:1px solid rgba(59,110,168,0.12);border-radius:8px;padding:12px 16px;margin:12px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.sale-box .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;}
.sale-box .val{font-size:18px;color:var(--text);font-weight:600;}
.modal-overlay{position:fixed;inset:0;background:rgba(6,10,16,0.6);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:400px;max-width:92vw;}
.modal-card h3{font-size:16px;font-weight:600;margin-bottom:10px;color:var(--text);}
.modal-actions{display:flex;gap:10px;margin-top:14px;}
.modal-actions .btn{flex:1;}
.user-info{display:flex;align-items:center;gap:10px;}
.user-avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);overflow:hidden;flex-shrink:0;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-name{font-size:13px;font-weight:500;color:var(--text);}
.user-role{font-size:10px;color:var(--text-muted);}
.empty{color:var(--text-muted);padding:16px;text-align:center;font-size:13px;}
.msg{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:12px;}
.msg-ok{background:rgba(63,143,92,0.06);color:#6FBE87;border:1px solid rgba(63,143,92,0.15);}
.msg-warn{background:rgba(181,69,58,0.06);color:#D07268;border:1px solid rgba(181,69,58,0.15);}
.search-wrapper{position:relative;}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card-bg);border:1px solid var(--border);border-radius:6px;max-height:180px;overflow-y:auto;z-index:10;display:none;margin-top:4px;}
.search-dropdown.show{display:block;}
.search-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;font-size:13px;color:var(--text-secondary);}
.search-item:hover{background:rgba(59,110,168,0.06);color:var(--text);}
.search-item .art{color:#6FA0DA;font-weight:600;}
.chart-box{height:200px;position:relative;}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;transition:border-color 0.15s,color 0.15s;}
.logout-btn:hover{border-color:rgba(181,69,58,0.3);color:#D07268;}
.actions{display:flex;gap:4px;flex-wrap:wrap;}
.flag-select{display:flex;gap:4px;align-items:center;}
.flag-select button{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:13px;transition:border-color 0.15s;}
.flag-select button:hover{border-color:var(--primary);}
.flag-select button.active{border-color:var(--primary);background:rgba(59,110,168,0.1);}

/* ============ SETTINGS ============ */
.theme-options{display:flex;gap:8px;flex-wrap:wrap;}
.theme-options button{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--text-secondary);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;transition:border-color 0.15s,color 0.15s;font-weight:500;}
.theme-options button:hover{border-color:var(--primary);color:var(--text);}
.theme-options button.active{border-color:var(--primary);background:rgba(59,110,168,0.1);color:#6FA0DA;}
.icon-options{display:flex;gap:8px;flex-wrap:wrap;}
.icon-options button{padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:14px;color:var(--text-secondary);transition:border-color 0.15s;}
.icon-options button:hover{border-color:var(--primary);}
.icon-options button.active{border-color:var(--primary);background:rgba(59,110,168,0.1);color:var(--text);}

/* ============ HISTORY / TOOLBAR ============ */
.history-toolbar{padding:16px;}
.history-date-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.history-date-row .field{min-width:210px;}
.history-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:14px;}
.history-header h3{margin:0;}
.history-subtitle{color:var(--text-muted);font-size:12px;margin-top:4px;}
.history-summary{margin-top:14px;padding:14px;border:1px solid var(--border);background:#131A24;border-radius:6px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
.summary-item{display:flex;flex-direction:column;gap:4px;min-width:150px;}
.summary-item span{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;}
.summary-item strong{color:var(--text);font-size:15px;}
.summary-item.paid strong{color:#6FBE87;}
.summary-item.debt strong{color:#D07268;}
.cash-button{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:6px;padding:9px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background 0.15s;}
.cash-button:hover{background:var(--primary-dark);}
.cash-modal{width:min(420px,calc(100vw - 32px));}
.cash-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px;}
.cash-kicker{color:#6FA0DA;font-size:10px;font-weight:700;letter-spacing:0.1em;margin-bottom:4px;text-transform:uppercase;}
.cash-modal h3{margin:0;}
.modal-close{width:28px;height:28px;border:1px solid var(--border);background:#101722;color:var(--text-secondary);border-radius:6px;font-size:16px;cursor:pointer;line-height:1;}
.cash-debt-box{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#131A24;border:1px solid var(--border);border-radius:6px;margin-bottom:16px;}
.cash-debt-box span{color:var(--text-secondary);font-size:12px;}
.cash-debt-box strong{color:#D07268;font-size:15px;}
.table-wrap{overflow-x:auto;}
@media(max-width:700px){
  .history-summary{gap:14px;}
  .summary-item{min-width:130px;}
  .history-date-row .field{min-width:100%;width:100%;}
}

/* ============ MODERN SHELL / SIDEBAR ============ */
:root{
  --sidebar:#0d1520;
  --sidebar-border:#1f2b3a;
  --surface:#121c28;
  --surface-2:#172333;
  --primary:#4f8dcc;
  --primary-soft:rgba(79,141,204,.13);
  --success:#5fbd83;
  --danger-soft:rgba(181,69,58,.12);
}
body{background:#0b131d;color:var(--text);overflow-x:hidden;}
.app-layout{min-height:100vh;display:flex;}
.sidebar{width:236px;flex:0 0 236px;position:fixed;inset:0 auto 0 0;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;z-index:40;padding:18px 12px;}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px;margin-bottom:10px;border-bottom:1px solid var(--sidebar-border);}
.sidebar-brand-mark{width:36px;height:36px;border-radius:10px;background:var(--primary-soft);border:1px solid rgba(79,141,204,.28);display:grid;place-items:center;color:#8db9e7;}
.sidebar-brand strong{font-size:16px;letter-spacing:-.02em;}
.sidebar-brand span{display:block;color:var(--text-muted);font-size:10px;margin-top:2px;}
.sidebar-nav{display:flex;flex-direction:column;gap:4px;overflow:auto;}
.sidebar-section{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#647286;padding:13px 11px 6px;font-weight:700;}
.sidebar-link{width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid transparent;border-radius:9px;background:transparent;color:#8d9aac;cursor:pointer;font:500 13px Inter,sans-serif;text-align:left;transition:.18s ease;}
.sidebar-link svg{width:18px;height:18px;flex:none;stroke:currentColor;}
.sidebar-link:hover{background:rgba(255,255,255,.035);color:#dce4ed;}
.sidebar-link.active{background:var(--primary-soft);border-color:rgba(79,141,204,.20);color:#9ec6ee;}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--sidebar-border);padding-top:12px;}
.sidebar-user{display:flex;align-items:center;gap:9px;padding:8px 9px 12px;}
.sidebar-user .user-avatar{width:34px;height:34px;}
.sidebar-user .user-name{font-size:12px;}
.sidebar-user .user-role{font-size:10px;}
.sidebar-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.sidebar-actions button{padding:8px;border:1px solid var(--sidebar-border);background:transparent;color:#8995a5;border-radius:8px;cursor:pointer;font:500 11px Inter,sans-serif;}
.sidebar-actions button:hover{border-color:#34475d;color:#e5ebf2;}
.main-area{margin-left:236px;min-width:0;width:calc(100% - 236px);}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;border-bottom:1px solid var(--border);background:rgba(11,19,29,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);}
.topbar-title{font-size:18px;font-weight:700;letter-spacing:-.025em;}
.topbar-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.page-content{max-width:1320px;margin:0 auto;padding:24px 28px 40px;}
.icon-button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);border-radius:9px;cursor:pointer;}
.icon-button svg{width:17px;height:17px;}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid var(--border);border-radius:10px;background:var(--card-bg);}
.user-chip .user-avatar{width:29px;height:29px;}
.mobile-nav-toggle{display:none;}
.stat-card{position:relative;overflow:hidden;}
.stat-card .stat-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--primary-soft);color:#8db9e7;margin-bottom:12px;}
.stat-card .stat-icon svg{width:18px;height:18px;}
.stat-card .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.stat-card .stat-value{font-size:25px;line-height:1.15;font-weight:750;letter-spacing:-.03em;margin-top:5px;}
.stats-filter{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.stats-filter .field{min-width:240px;flex:1;}
.table-card{padding:0;overflow:hidden;}
.table-card .table-head{padding:16px 18px;border-bottom:1px solid var(--border);}
.table-card .table-wrap{padding:0 8px 8px;}
.table-card table{min-width:720px;}
.table-card th,.table-card td{padding:11px 10px;}
.card{background:var(--card-bg);}
.btn svg{width:15px;height:15px;vertical-align:-3px;margin-right:5px;}
.action-icon{width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border-radius:8px;}
.action-icon svg{margin:0;width:15px;height:15px;}
/* better login */
.login-wrap{background:radial-gradient(circle at 50% 20%,rgba(79,141,204,.10),transparent 35%),#0b131d;}
.login-card{width:410px;padding:34px;border-radius:16px;background:#111b27;border:1px solid #253346;box-shadow:0 24px 70px rgba(0,0,0,.38);}
.login-mark{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;background:var(--primary-soft);border:1px solid rgba(79,141,204,.25);display:grid;place-items:center;color:#9ec6ee;}
.login-card h1{font-size:23px;margin-bottom:6px;}
.login-card .subtitle{line-height:1.5;margin-bottom:22px;}
.login-card .field{margin-bottom:13px;}
.login-card .field input{height:44px;border-radius:9px;background:#0d1621;}
.login-submit{height:44px;border-radius:9px;margin-top:5px;font-size:14px;}
.password-wrap{position:relative;}
.password-wrap input{padding-right:45px!important;}
.password-toggle{position:absolute;right:5px;top:5px;width:34px;height:34px;border:0;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:7px;}
.password-toggle svg{width:17px;height:17px;}
.login-footer{margin-top:17px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);}
/* mobile */
@media(max-width:820px){
  .sidebar{position:fixed;left:0;right:0;top:auto;bottom:0;width:100%;height:68px;padding:6px 7px;background:rgba(13,21,32,.97);border-right:0;border-top:1px solid var(--sidebar-border);display:block;backdrop-filter:blur(14px);}

<div id="app"><div class="loading">Yuklanmoqda...</div></div>

<script>
// ============ KONFIG ============
const API_URL = '/api';
let token = localStorage.getItem('token');

// ============ TILLAR ============
const LANG = {
  uz: { hello: 'Salom', goodbye: 'Hayr', login: 'Kirish', logout: 'Chiqish', customers: 'Mijozlar', products: 'Mahsulotlar', sales: 'Sotuv', stats: 'Statistika', history: 'Tarix', settings: 'Sozlamalar', admin: 'Admin', user: 'Xodim', add: 'Qo\'shish', delete: 'O\'chirish', edit: 'Tahrirlash', save: 'Saqlash', cancel: 'Bekor qilish', debt: 'Qarz', paid: 'To\'langan', total: 'Jami', last: 'Oxirgi mahsulot', theme: 'Dizayn', light: 'Yorug\'', dark: 'Qorong\'i', classic: 'Klassik', icon: 'Belgi', select_date: 'Sana tanlang', show: 'Ko\'rsatish' },
  ru: { hello: 'Привет', goodbye: 'До свидания', login: 'Войти', logout: 'Выйти', customers: 'Клиенты', products: 'Товары', sales: 'Продажи', stats: 'Статистика', history: 'История', settings: 'Настройки', admin: 'Админ', user: 'Сотрудник', add: 'Добавить', delete: 'Удалить', edit: 'Редактировать', save: 'Сохранить', cancel: 'Отмена', debt: 'Долг', paid: 'Оплачено', total: 'Итого', last: 'Последний товар', theme: 'Дизайн', light: 'Светлый', dark: 'Тёмный', classic: 'Классический', icon: 'Иконка', select_date: 'Выберите дату', show: 'Показать' },
  en: { hello: 'Hello', goodbye: 'Goodbye', login: 'Login', logout: 'Logout', customers: 'Customers', products: 'Products', sales: 'Sales', stats: 'Statistics', history: 'History', settings: 'Settings', admin: 'Admin', user: 'Staff', add: 'Add', delete: 'Delete', edit: 'Edit', save: 'Save', cancel: 'Cancel', debt: 'Debt', paid: 'Paid', total: 'Total', last: 'Last Product', theme: 'Theme', light: 'Light', dark: 'Dark', classic: 'Classic', icon: 'Icon', select_date: 'Select date', show: 'Show' }
};
let lang = localStorage.getItem('lang') || 'uz';
function t(k){ return LANG[lang][k] || k; }

// ============ THEME ============
let currentTheme = localStorage.getItem('theme') || 'dark';
let currentIcon = localStorage.getItem('icon') || 'TN';

function applyTheme(theme) {
  document.body.className = theme || currentTheme;
}
function applyIcon(icon) {
  document.querySelectorAll('.app-icon').forEach(el => el.textContent = icon || currentIcon);
}

// ============ STATE ============
let state = {
  loaded: false, loading: false,
  users: [], customers: [], products: [], sales: [], payments: [],
  currentUser: null, view: 'mijozlar', loginErr: '', error: null, payModal: null,
  saleDraft: { sana: '', productId: '', customerId: '', soni: '', tolangan: '' },
  historyFilter: { sana: '', customerId: '' },
  searchResults: [], showSearch: false, searchQuery: '',
  settings: { avatar: localStorage.getItem('user_avatar') || '' },
  showWelcome: false,
  isLoggingOut: false,
  statsFilter: { customerId: '', type: 'sotuvlar' }
};

// ============ API ============
async function apiRequest(endpoint, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    const res = await fetch(API_URL + endpoint, { ...opts, headers });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error || 'Xatolik '+res.status); }
    return res.json();
  } catch(e) { if(e.message.includes('Failed to fetch')) throw new Error('Serverga ulanish yo\'q'); throw e; }
}

async function loginUser(l,p){ const d=await apiRequest('/auth/login',{method:'POST',body:JSON.stringify({login:l,password:p})}); token=d.token; localStorage.setItem('token',token); return d.user; }
async function getCurrentUser(){ if(!token) return null; return apiRequest('/auth/me'); }
async function getCustomers(){ return apiRequest('/customers'); }
async function addCustomer(n,p){ return apiRequest('/customers',{method:'POST',body:JSON.stringify({name:n,phone:p})}); }
async function updateCustomer(id,n,p){ return apiRequest('/customers/'+id,{method:'PUT',body:JSON.stringify({name:n,phone:p})}); }
async function deleteCustomer(id){ return apiRequest('/customers/'+id,{method:'DELETE'}); }
async function getProducts(){ return apiRequest('/products'); }
async function searchProducts(q){ if(!q||q.length<1) return getProducts(); return apiRequest('/products/search/'+encodeURIComponent(q)); }
async function addProduct(n,pr){ return apiRequest('/products',{method:'POST',body:JSON.stringify({name:n,narx:pr})}); }
async function updateProduct(id,n,pr){ return apiRequest('/products/'+id,{method:'PUT',body:JSON.stringify({name:n,narx:pr})}); }
async function deleteProduct(id){ return apiRequest('/products/'+id,{method:'DELETE'}); }
async function getSales(){ return apiRequest('/sales'); }
async function addSale(d){ return apiRequest('/sales',{method:'POST',body:JSON.stringify(d)}); }
async function updateSale(id,d){ return apiRequest('/sales/'+id,{method:'PUT',body:JSON.stringify(d)}); }
async function deleteSale(id){ return apiRequest('/sales/'+id,{method:'DELETE'}); }
async function getPayments(){ return apiRequest('/payments'); }
async function addPayment(cid,s,a){ return apiRequest('/payments',{method:'POST',body:JSON.stringify({customerId:cid,sana:s,amount:a})}); }
async function getUsers(){ return apiRequest('/users'); }
async function registerUser(l,p,r){ return apiRequest('/users/register',{method:'POST',body:JSON.stringify({login:l,password:p,role:r||'user'})}); }
async function deleteUser(l){ return apiRequest('/users/'+l,{method:'DELETE'}); }

function fmt(n){ return Math.round(n||0).toLocaleString('ru-RU'); }
function today(){ return new Date().toISOString().slice(0,10); }

function getCustomerDebt(customerId) {
  if (!customerId) return 0;
  const sales = state.sales.filter(s => s.customerId === customerId);
  return sales.reduce((sum, s) => {
    const jami = Number(s.jami || 0);
    const tolangan = Math.min(Number(s.tolangan || 0), jami);
    return sum + Math.max(0, jami - tolangan);
  }, 0);
}

function getDebtByDate(customerId, sana) {
  if (!customerId || !sana) return 0;
  const sales = state.sales.filter(s => s.customerId === customerId && s.sana === sana);
  const totalDebt = sales.reduce((a,s) => a + (s.qarz||0), 0);
  const payments = state.payments.filter(p => p.customerId === customerId && p.sana === sana);
  const totalPaid = payments.reduce((a,p) => a + p.amount, 0);
  return Math.max(0, totalDebt - totalPaid);
}

function computeSale(d) {
  const product = state.products.find(p => p._id === d.productId);
  const jami = product && d.soni ? product.narx * Number(d.soni) : 0;
  const tolangan = Number(d.tolangan || 0);
  const qarz = Math.max(0, jami - tolangan);
  const ortiqcha = Math.max(0, tolangan - jami);
  const oldDebt = d.customerId ? getCustomerDebt(d.customerId) : 0;
  return { product, jami, tolangan, qarz, ortiqcha, oldDebt, debtAfter: Math.max(0, oldDebt - ortiqcha) };
}

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');
  if (state.loading) { app.innerHTML = '<div class="loading">Yuklanmoqda...</div>'; return; }
  if (!state.loaded) { app.innerHTML = '<div class="loading">Ma\'lumotlar yuklanmoqda...</div>'; return; }
  if (!state.currentUser) { app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if (state.error) { app.innerHTML = '<div style="padding:40px;text-align:center;color:#D07268;"><h3>Xatolik</h3><p>'+state.error+'</p><button class="btn btn-primary" onclick="location.reload()" type="button">Qayta yuklash</button></div>'; return; }
  
  if (state.isLoggingOut) {
    app.innerHTML = renderLogoutAnimation();
    return;
  }
  
  if (state.showWelcome) {
    app.innerHTML = renderWelcome();
    setTimeout(() => { state.showWelcome = false; render(); }, 1200);
    return;
  }
  
  app.innerHTML = renderShell();
  attachShellEvents();
  if (state.view === 'statistika') setTimeout(drawCharts, 300);
  
  applyTheme(currentTheme);
  applyIcon(currentIcon);
}

// ============ WELCOME ============
function renderWelcome() {
  const userName = state.currentUser?.login || 'User';
  const hello = LANG[lang].hello;
  return `
  <div class="fade" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--bg-start);">

    <div class="welcome-text">${hello}, ${userName}</div>
  </div>`;
}

// ============ LOGOUT ANIMATSIYA ============
function renderLogoutAnimation() {
  const userName = state.currentUser?.login || 'User';

    <div class="welcome-text">${goodbye}, ${userName}</div>
  </div>`;
}

// ============ LOGIN ============
function renderLogin() {
  const flags = { uz:'UZ', ru:'RU', en:'EN' };
  return `

      <div class="flag-select" style="justify-content:center;margin-bottom:18px;">
        ${['uz','ru','en'].map(l => `<button class="${lang===l?'active':''}" onclick="document.getElementById('loginLang').value='${l}';this.parentElement.querySelectorAll('button').forEach(b= type="button">b.classList.remove('active'));this.classList.add('active');">${flags[l]}</button>`).join('')}
      </div>

      <form id="loginForm">

        <div class="field"><label>Parol</label><div class="password-wrap"><input id="parolInput" type="password" autocomplete="current-password" placeholder="Parolni kiriting" required><button class="password-toggle" type="button" id="togglePassword" aria-label="Parolni ko'rsatish">${iconSvg('logo')}</button></div></div>
        <button class="btn btn-primary login-submit" type="submit" style="width:100%;">${t('login')}</button>
      </form>
      <div class="login-footer">Toys Note · Business management system</div>
    </div>
  </div>`;
}

function attachLoginEvents() {
  document.getElementById('togglePassword')?.addEventListener('click', function(){
    const input = document.getElementById('parolInput');
    if (!input) return;
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const login = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('parolInput').value;
    const langVal = document.getElementById('loginLang').value || 'uz';
    lang = langVal; localStorage.setItem('lang', lang);
    state.loading = true; state.loginErr = ''; render();
    try {
      const user = await loginUser(login, password);
      state.currentUser = user;
      await loadData();
      state.loaded = true; state.loading = false;
      state.showWelcome = true;
      render();
    } catch(err) {
      state.loading = false;
      state.loginErr = err.message || "Login yoki parol noto'g'ri.";
      render();
    }
  });
}

// ============ SHELL ============
function iconSvg(id){
  const icons = {
    customers:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,

  const navs = [

function renderView() {

    case 'statistika': return viewStats();
    case 'tarix': return viewHistory();
    case 'sozlamalar': return viewSettings();
    default: return '';
  }
}

function attachShellEvents() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', function() {
      state.view = this.dataset.nav;
      render();
    });
  });
  
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();

      if (!state.currentUser || state.isLoggingOut) return;

      if (confirm(t('goodbye') + ', ' + state.currentUser.login + '.')) {
        state.isLoggingOut = true;
        render();

        setTimeout(() => {
          state.currentUser = null;
          token = null;
          localStorage.removeItem('token');
          state.loaded = true;
          state.isLoggingOut = false;
          state.error = null;
          render();
        }, 900);
      }
    });
  }
  
  attachViewEvents();
}

// ============ STATISTIKA ============
function viewStats() {
  const selectedCustomer = state.statsFilter.customerId || '';
  const statsType = state.statsFilter.type || 'sotuvlar';

  const filteredSales = selectedCustomer
    ? state.sales.filter(s => s.customerId === selectedCustomer)
    : state.sales;

  const filteredPayments = selectedCustomer
    ? state.payments.filter(p => p.customerId === selectedCustomer)
    : state.payments;

  const totalSales = filteredSales.reduce((sum,s) => sum + Number(s.jami || 0), 0);
  const totalPaidFromSales = filteredSales.reduce((sum,s) => {
    const jami = Number(s.jami || 0);
    return sum + Math.min(Number(s.tolangan || 0), jami);
  }, 0);
  const totalDebt = Math.max(0, totalSales - totalPaidFromSales);

  const totalKassa = filteredPayments.reduce((sum,p) => sum + Number(p.amount || 0), 0);

  const customer = state.customers.find(c => c._id === selectedCustomer);

  const customerOptions = state.customers.map(c => `
    <option value="${c._id}" ${selectedCustomer===c._id?'selected':''}>${c.name}</option>
  `).join('');

  let content = '';

  if (statsType === 'sotuvlar') {
    const rows = filteredSales.map(s => {
      const p = state.products.find(x => x._id === s.productId);
      const jami = Number(s.jami || 0);
      const paid = Math.min(Number(s.tolangan || 0), jami);
      const debt = Math.max(0, jami - paid);
      const c = state.customers.find(x => x._id === s.customerId);

      return `<tr>
        <td>${s.sana || '—'}</td>
        <td>${c ? c.name : '—'}</td>
        <td>${p ? p.name : '—'}</td>
        <td>${s.soni || 0} dona</td>
        <td>${fmt(jami)} so'm</td>
        <td>${fmt(paid)} so'm</td>
        <td>${debt > 0 ? `<span class="pill pill-debt">${fmt(debt)} so'm</span>` : `<span class="pill pill-ok">To'liq</span>`}</td>
      </tr>`;
    }).join('');

    content = `
      <div class="grid" style="margin-bottom:14px;">
        <div class="card glass stat-card" style="margin:0;">
          <div class="stat-icon">${iconSvg('sales')}</div>
          <div class="stat-label">Jami sotuv</div>
          <div class="stat-value">${fmt(totalSales)} so'm</div>
        </div>
        <div class="card glass stat-card" style="margin:0;">
          <div class="stat-icon" style="background:rgba(95,189,131,.12);color:#78c996;">${iconSvg('history')}</div>
          <div class="stat-label">To'langan</div>
          <div class="stat-value" style="color:#6fc48c;">${fmt(totalPaidFromSales)} so'm</div>
        </div>
        <div class="card glass stat-card" style="margin:0;">
          <div class="stat-icon" style="background:rgba(181,69,58,.12);color:#df8277;">${iconSvg('stats')}</div>
          <div class="stat-label">Qarz</div>
          <div class="stat-value" style="color:#d9786e;">${fmt(totalDebt)} so'm</div>
        </div>
      </div>

      <div class="card glass table-card">
        <div class="table-head">
          <h3 style="margin:0;">${customer ? customer.name + ' — sotuvlar' : 'Barcha sotuvlar'}</h3>
          <div class="history-subtitle">${filteredSales.length} ta sotuv</div>
        </div>
        ${filteredSales.length
          ? `<div class="table-wrap"><table><thead><tr>
              <th>Sana</th><th>Mijoz</th><th>Mahsulot</th><th>Soni</th><th>Jami</th><th>To'langan</th><th>Qarz</th>
            </tr></thead><tbody>${rows}</tbody></table></div>`
          : `<div class="empty">Sotuvlar mavjud emas</div>`}
      </div>

      <div class="grid">
        <div class="card glass"><h3>Kunlik savdo</h3><div class="chart-box"><canvas id="chartDaily"></canvas></div></div>
        <div class="card glass"><h3>Mahsulot sotuvi</h3><div class="chart-box"><canvas id="chartProducts"></canvas></div></div>
      </div>`;
  }

  if (statsType === 'tolovlar') {
    const paymentSales = filteredSales.filter(s => Number(s.tolangan || 0) > 0);
    const totalSalePayments = paymentSales.reduce((sum,s) => {
      return sum + Math.min(Number(s.tolangan || 0), Number(s.jami || 0));
    }, 0);

    const rows = paymentSales.map(s => {
      const p = state.products.find(x => x._id === s.productId);
      const c = state.customers.find(x => x._id === s.customerId);
      const amount = Math.min(Number(s.tolangan || 0), Number(s.jami || 0));

      return `<tr>
        <td>${s.sana || '—'}</td>
        <td>${c ? c.name : '—'}</td>
        <td>${p ? p.name : '—'}</td>
        <td>${fmt(amount)} so'm</td>
        <td>${fmt(Number(s.jami || 0))} so'm</td>
      </tr>`;
    }).join('');

    content = `
      <div class="grid" style="margin-bottom:14px;">
        <div class="card glass stat-card" style="margin:0;">
          <div class="stat-icon">${iconSvg('history')}</div>
          <div class="stat-label">To'lovlar</div>
          <div class="stat-value">${paymentSales.length} ta</div>
        </div>
        <div class="card glass stat-card" style="margin:0;">
          <div class="stat-icon" style="background:rgba(95,189,131,.12);color:#78c996;">${iconSvg('sales')}</div>
          <div class="stat-label">Jami to'lov</div>
          <div class="stat-value" style="color:#6fc48c;">${fmt(totalSalePayments)} so'm</div>
        </div>
      </div>

      <div class="card glass table-card">
        <div class="table-head">
          <h3 style="margin:0;">${customer ? customer.name + ' — to\'lovlar' : 'Barcha to\'lovlar'}</h3>
          <div class="history-subtitle">${paymentSales.length} ta to'lov</div>
        </div>
        ${paymentSales.length
          ? `<div class="table-wrap"><table><thead><tr>
              <th>Sana</th><th>Mijoz</th><th>Mahsulot</th><th>To'lov</th><th>Sotuv jami</th>
            </tr></thead><tbody>${rows}</tbody></table></div>`
          : `<div class="empty">To'lovlar mavjud emas</div>`}
      </div>`;
  }

  if (statsType === 'kassa') {
    const rows = filteredPayments.map(p => {
      const c = state.customers.find(x => x._id === p.customerId);

      return `<tr>
        <td>${p.sana || '—'}</td>
        <td>${c ? c.name : '—'}</td>
        <td>${fmt(Number(p.amount || 0))} so'm</td>
      </tr>`;
    }).join('');

    content = `
      <div class="grid" style="margin-bottom:14px;">
        <div class="card glass stat-card" style="margin:0;">
          <div class="stat-icon">${iconSvg('history')}</div>
          <div class="stat-label">Kassa operatsiyalari</div>
          <div class="stat-value">${filteredPayments.length} ta</div>
        </div>
        <div class="card glass stat-card" style="margin:0;">
          <div class="stat-icon" style="background:rgba(95,189,131,.12);color:#78c996;">${iconSvg('sales')}</div>
          <div class="stat-label">Kassaga tushgan</div>
          <div class="stat-value" style="color:#6fc48c;">${fmt(totalKassa)} so'm</div>
        </div>
      </div>

      <div class="card glass table-card">
        <div class="table-head">
          <h3 style="margin:0;">${customer ? customer.name + ' — kassa' : 'Barcha kassa tushumlari'}</h3>
          <div class="history-subtitle">${filteredPayments.length} ta kassa yozuvi</div>
        </div>
        ${filteredPayments.length
          ? `<div class="table-wrap"><table><thead><tr>
              <th>Sana</th><th>Mijoz</th><th>Kassaga tushgan</th>
            </tr></thead><tbody>${rows}</tbody></table></div>`
          : `<div class="empty">Kassa yozuvlari mavjud emas</div>`}
      </div>`;
  }

  return `
    <div class="card glass stats-filter">
      <div class="field">
        <label>Mijoz</label>
        <select id="statsCustomer">
          <option value="">Barcha mijozlar</option>
          ${customerOptions}
        </select>
      </div>

      <div class="field">
        <label>Ko'rinish</label>
        <select id="statsType">
          <option value="sotuvlar" ${statsType==='sotuvlar'?'selected':''}>🛍 Sotuvlar</option>
          <option value="tolovlar" ${statsType==='tolovlar'?'selected':''}>💳 To'lovlar</option>
          <option value="kassa" ${statsType==='kassa'?'selected':''}>💰 Kassa</option>
        </select>
      </div>

      <div style="padding:10px 12px;border:1px solid var(--border);border-radius:9px;color:var(--text-secondary);font-size:12px;align-self:end;">
        Tanlangan:
        <strong style="color:var(--text);">${customer ? customer.name : 'Barcha mijozlar'}</strong>
      </div>
    </div>

    ${content}`;
}

// ============ HISTORY ============
function viewHistory() {
  const f = state.historyFilter;
  const selectedDate = f.sana || '';

  let matches = selectedDate
    ? state.sales.filter(s => s.sana === selectedDate && (!f.customerId || s.customerId === f.customerId))
    : [];

  let totalJ = 0;
  let totalP = 0;
  let totalQ = 0;

  matches.forEach(s => {
    const jami = Number(s.jami || 0);
    const paid = Math.min(Number(s.tolangan || 0), jami);
    const debt = Math.max(0, jami - paid);
    totalJ += jami;
    totalP += paid;
    totalQ += debt;
  });

  const rows = matches.map(s => {
    const p = state.products.find(x => x._id === s.productId);
    const c = state.customers.find(x => x._id === s.customerId);
    const jami = Number(s.jami || 0);
    const paid = Math.min(Number(s.tolangan || 0), jami);
    const debt = Math.max(0, jami - paid);

    return `<tr>
      <td>${s.sana || '—'}</td>
      <td>${c ? c.name : '—'}</td>
      <td>${p ? p.name : '—'}</td>
      <td>${s.soni || 0} dona</td>
      <td>${fmt(jami)} so'm</td>
      <td>${fmt(paid)} so'm</td>
      <td>
        ${debt > 0
          ? `<span class="pill pill-debt">${fmt(debt)} so'm</span>`
          : `<span class="pill pill-ok">To'liq</span>`}
      </td>
      <td class="actions">
        <button class="btn btn-edit" data-edit-sale="${s._id}" type="button">Tahrirlash</button>
        <button class="btn btn-danger" data-del-sale="${s._id}" type="button">O'chirish</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="card glass history-toolbar">
    <div class="history-date-row">
      <div class="field">
        <label>Sana</label>
        <input type="date" id="histSana" value="${selectedDate}">

        <label>Mijoz</label>
        <select id="histCustomer">
          <option value="">Barcha mijozlar</option>
          ${state.customers.map(c => `<option value="${c._id}" ${f.customerId===c._id?'selected':''}>${c.name}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary" id="histShow" type="button">Ko'rsatish</button>
      <button class="btn btn-secondary" id="histClear" type="button">Tozalash</button>
    </div>
  </div>

  <div class="card glass">
    <div class="history-header">
      <div>
        <h3>Sotuvlar tarixi</h3>
        ${selectedDate
          ? `<div class="history-subtitle">${selectedDate} sanasidagi sotuvlar</div>`
          : `<div class="history-subtitle">Sotuvlarni ko'rish uchun sana tanlang</div>`}
      </div>
    </div>

    ${selectedDate
      ? (rows
        ? `<div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Sana</th>
                  <th>Mijoz</th>
                  <th>Mahsulot</th>
                  <th>Soni</th>
                  <th>Jami</th>
                  <th>To'langan</th>
                  <th>Qarz</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>

          <div class="history-summary">
            <div class="summary-item">
              <span>Jami</span>
              <strong>${fmt(totalJ)} so'm</strong>
            </div>
            <div class="summary-item paid">
              <span>To'langan</span>
              <strong>${fmt(totalP)} so'm</strong>
            </div>
            <div class="summary-item ${totalQ > 0 ? 'debt' : 'paid'}">
              <span>Qarz</span>
              <strong>${fmt(totalQ)} so'm</strong>
            </div>
            ${totalQ > 0 && f.customerId
              ? `<button class="cash-button" id="dateCashBtn" type="button">Kassa</button>`
              : ''}
          </div>`
        : `<div class="empty">Bu sanada sotuv mavjud emas</div>`)
      : `<div class="empty">Yuqoridan sana tanlang.</div>`}
  </div>`;
}

// ============ CHARTS ============
let charts = [];
function drawCharts() {
  if (state.view !== 'statistika' || (state.statsFilter.type || 'sotuvlar') !== 'sotuvlar') return;
  charts.forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = [];
  
  const selectedCustomer = state.statsFilter.customerId || '';
  const chartSales = selectedCustomer ? state.sales.filter(s => s.customerId === selectedCustomer) : state.sales;
  const byDay = {};
  chartSales.forEach(s => { byDay[s.sana] = (byDay[s.sana] || 0) + Number(s.jami || 0); });
  const days = Object.keys(byDay).sort();
  const dc = document.getElementById('chartDaily');
  if (dc && days.length) {
    charts.push(new Chart(dc, {
      type: 'line',
      data: { labels: days, datasets: [{ label: 'Savdo', data: days.map(d=>byDay[d]), borderColor: '#3B6EA8', backgroundColor: 'rgba(59,110,168,0.06)', fill: true, tension: 0.25 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    }));
  }
  
  const byProd = {};
  chartSales.forEach(s => {
    const p = state.products.find(x => x._id === s.productId);
    const name = p ? p.name : '—';
    byProd[name] = (byProd[name] || 0) + s.soni;
  });
  const pc = document.getElementById('chartProducts');
  if (pc) {
    const labels = Object.keys(byProd);
    if (labels.length) {
      charts.push(new Chart(pc, {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Dona', data: labels.map(l=>byProd[l]), backgroundColor: '#4f8dcc' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      }));
    }
  }
}

// ============ EVENTS ============
function attachViewEvents() {
  // Customers
  document.getElementById('customerForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    if (!name) return;
    try { await addCustomer(name, phone); await loadData(); render(); } catch(err) { alert(err.message); }
  });
  
  document.querySelectorAll('[data-del-customer]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('O\'chirish?')) return;
      try { await deleteCustomer(this.dataset.delCustomer); await loadData(); render(); } catch(err) { alert(err.message); }
    });
  });
  
  document.querySelectorAll('[data-pay]').forEach(btn => {
    btn.addEventListener('click', function() {
      state.payModal = { customerId: this.dataset.pay };
      renderPayModal();
    });
  });
  
  // Products
  document.getElementById('productForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('prodName').value.trim();
    const narx = Number(document.getElementById('prodNarx').value);
    if (!name || !narx) return;
    try {
      const r = await addProduct(name, narx);
      alert('Mahsulot qo\'shildi.\nArtikul: '+r.artikul+'\nNomi: '+r.name+'\nNarxi: '+fmt(r.narx)+' so\'m');
      await loadData(); render();
    } catch(err) { alert(err.message); }
  });
  
  document.querySelectorAll('[data-del-product]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('O\'chirish?')) return;
      try { await deleteProduct(this.dataset.delProduct); await loadData(); render(); } catch(err) { alert(err.message); }
    });
  });
  // Sales
  const saleForm = document.getElementById('saleForm');
  if (saleForm) {
    const searchInput = document.getElementById('saleSearch');
    const productHidden = document.getElementById('saleProduct');
    if (searchInput) {
      let timeout;
      searchInput.addEventListener('input', async function() {
        const q = this.value.trim();
        state.searchQuery = q;
        clearTimeout(timeout);
        timeout = setTimeout(async () => {
          if (q.length > 0) {
            try { const r = await searchProducts(q); state.searchResults = r; state.showSearch = r.length > 0; render(); } catch(e) {}
          } else { state.searchResults = []; state.showSearch = false; render(); }
        }, 300);
      });
      
      document.addEventListener('click', function(e) {
        const item = e.target.closest('.search-item');
        if (item) {
          const pid = item.dataset.pid;
          const pname = item.dataset.pname;
          const part = item.dataset.part;
          if (productHidden) productHidden.value = pid;
          searchInput.value = part + ' - ' + pname;
          state.searchResults = []; state.showSearch = false; state.searchQuery = '';
          state.saleDraft.productId = pid;
          render();
          setTimeout(() => { const ev = new Event('input'); document.getElementById('saleSoni')?.dispatchEvent(ev); }, 100);
        }
      });
    }
    
    const updateSale = () => {
      state.saleDraft = {
        sana: document.getElementById('saleSana').value,
        customerId: document.getElementById('saleCustomer').value,
        productId: document.getElementById('saleProduct').value,
        soni: document.getElementById('saleSoni').value,
        tolangan: document.getElementById('saleTolangan').value
      };
      const f = computeSale(state.saleDraft);
      document.getElementById('saleJami').textContent = fmt(f.jami) + " so'm";
      document.getElementById('salePer').textContent = (f.product ? fmt(f.product.narx) : 0) + " so'm";
      const q = document.getElementById('saleQarz');
      q.value = fmt(f.qarz) + " so'm";
      q.style.background = f.qarz > 0 ? 'rgba(181,69,58,0.06)' : 'rgba(63,143,92,0.06)';
      q.style.color = f.qarz > 0 ? '#D07268' : '#6FBE87';
      q.style.borderColor = f.qarz > 0 ? 'rgba(181,69,58,0.15)' : 'rgba(63,143,92,0.15)';
    };
    
    ['saleSana','saleCustomer','saleSoni','saleTolangan'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener(el.tagName==='SELECT'||el.type==='date'?'change':'input', updateSale);
    });
    
    saleForm.addEventListener('submit', async e => {
      e.preventDefault();
      const d = state.saleDraft;
      if (!d.customerId || !d.productId || !d.soni || Number(d.soni)<=0) {
        alert('Mijoz, mahsulot va sonini to\'g\'ri kiriting.');
        return;
      }
      try {
        const r = await addSale({
          sana: d.sana || today(),
          customerId: d.customerId,
          productId: d.productId,
          soni: Number(d.soni),
          tolangan: Number(d.tolangan || 0)
        });
        state.saleDraft = { sana: today(), productId: '', customerId: '', soni: '', tolangan: '' };
        state.searchQuery = ''; state.searchResults = []; state.showSearch = false;
        if (searchInput) searchInput.value = '';
        if (productHidden) productHidden.value = '';
        await loadData(); render();
        alert('Sotuv saqlandi.\nJami: '+fmt(r.jami)+' so\'m\nQarz: '+fmt(r.qarz)+' so\'m');
      } catch(err) { alert(err.message); }
    });
  }
  
  // History
  document.getElementById('histShow')?.addEventListener('click', function() {
    state.historyFilter = {
      sana: document.getElementById('histSana').value,
      customerId: document.getElementById('histCustomer')?.value || ''
    };
    render();
  });

  document.getElementById('histClear')?.addEventListener('click', function() {
    state.historyFilter = { sana: '', customerId: '' };
    render();
  });

  document.getElementById('dateCashBtn')?.addEventListener('click', function() {
    openDateCashModal(state.historyFilter.customerId, state.historyFilter.sana);
  });

  // History - Edit & Delete
  document.querySelectorAll('[data-edit-sale]').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.editSale;
      const sale = state.sales.find(s => s._id === id);
      if (sale) {
        const newTolangan = prompt('To\'langan summani o\'zgartiring (so\'m):', sale.tolangan);
        if (newTolangan !== null) {
          const newVal = Number(newTolangan);
          if (newVal >= 0 && newVal <= sale.jami) {
            updateSale(id, { ...sale, tolangan: newVal, qarz: sale.jami - newVal }).then(async () => { await loadData(); render(); }).catch(err => alert(err.message));
          } else {
            alert('To\'langan summa jami summadan katta bo\'lishi mumkin emas.');
          }
        }
      }
    });
  });
  
  document.querySelectorAll('[data-del-sale]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('Sotuvni o\'chirish?')) return;
      try {
        await deleteSale(this.dataset.delSale);
        await loadData();
        render();
      } catch(err) { alert(err.message); }
    });
  });
  
  // Settings
  document.getElementById('avatarForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    const url = document.getElementById('avatarUrl').value.trim();
    if (url) { state.settings.avatar = url; localStorage.setItem('user_avatar', url); render(); }
  });
  
  document.getElementById('userForm')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    const login = document.getElementById('newLogin').value.trim();
    const password = document.getElementById('newParol').value;
    if (!login || !password) return;
    try {
      await registerUser(login, password);
      await loadData();
      render();
    } catch(err) { alert(err.message); }
  });
  
  document.querySelectorAll('[data-del-user]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('O\'chirish?')) return;
      try { await deleteUser(this.dataset.delUser); await loadData(); render(); } catch(err) { alert(err.message); }
    });
  });
  
  // Stats
  document.getElementById('statsCustomer')?.addEventListener('change', function() {
    state.statsFilter.customerId = this.value;
    render();
  });

  document.getElementById('statsType')?.addEventListener('change', function() {
    state.statsFilter.type = this.value;
    render();
  });
  
  // Theme
  document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', function() {
      currentTheme = this.dataset.theme;
      localStorage.setItem('theme', currentTheme);
      document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      applyTheme(currentTheme);
      render();
    });
  });
  
  document.querySelectorAll('[data-icon]').forEach(btn => {
    btn.addEventListener('click', function() {
      currentIcon = this.dataset.icon;
      localStorage.setItem('icon', currentIcon);
      document.querySelectorAll('[data-icon]').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      applyIcon(currentIcon);
      render();
    });
  });
}


// ============ DATE CASH MODAL ============
function openDateCashModal(customerId, sana) {
  if (!customerId || !sana) {
    alert('Avval sana va mijozni tanlang.');
    return;
  }

  const customer = state.customers.find(c => c._id === customerId);
  if (!customer) { alert('Mijoz topilmadi.'); return; }

  const debt = getCustomerDebt(customerId);
  if (debt <= 0) { alert('Bu mijozda qarz mavjud emas.'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'dateCashOverlay';
  overlay.innerHTML = `
    <div class="modal-card glass cash-modal">
      <div class="cash-modal-head">
        <div><div class="cash-kicker">Kassa</div><h3>${customer.name}</h3><div style="color:var(--text-secondary);font-size:12px;margin-top:4px;">Joriy qarz: <strong style="color:#d9786e;">${fmt(debt)} so'm</strong></div></div>
        <button type="button" class="modal-close" id="dateCashCancel">×</button>
      </div>
      <form id="dateCashForm">
        <div class="field"><label>Pul olingan sana</label><input type="date" id="dateCashSana" value="${sana}" required></div>
        <div class="field"><label>Olingan summa (so'm)</label><input type="number" id="dateCashAmount" min="1" max="${debt}" step="1" required placeholder="0"></div>
        <div class="cash-debt-box"><span>Joriy qarz</span><strong>${fmt(debt)} so'm</strong></div>
        <div class="modal-actions"><button type="button" class="btn btn-secondary" id="dateCashCancel2">Bekor qilish</button><button type="submit" class="cash-button">Kassaga kiritish</button></div>
      </form>
    </div>`;
  document.body.appendChild(overlay);

  const close = () => document.getElementById('dateCashOverlay')?.remove();
  document.getElementById('dateCashCancel')?.addEventListener('click', close);
  document.getElementById('dateCashCancel2')?.addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  document.getElementById('dateCashForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const paymentDate = document.getElementById('dateCashSana').value;
    const amount = Number(document.getElementById('dateCashAmount').value);
    if (!paymentDate) { alert('Sanani tanlang.'); return; }
    if (!Number.isFinite(amount) || amount <= 0) { alert("To'g'ri summa kiriting."); return; }
    if (amount > debt) { alert('Summa qarzdan katta bo\'lishi mumkin emas.'); return; }
    try {
      await addPayment(customerId, paymentDate, amount);
      close();
      await loadData();
      render();
      alert('Kassa saqlandi.\nSana: ' + paymentDate + '\nSumma: ' + fmt(amount) + " so'm");
    } catch (err) { alert('Kassani saqlashda xato: ' + err.message); }
  });
}

// ============ PAY MODAL ============
function renderPayModal() {
  const c = state.customers.find(x => x._id === state.payModal.customerId);
  if (!c) return;
  const debt = getCustomerDebt(c._id);
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'payOverlay';
  overlay.innerHTML = `
    <div class="modal-card glass">
      <h3>Qarz to'lash — ${c.name}</h3>
      <p style="color:var(--text-secondary);font-size:13px;margin-top:-6px;">Joriy qarz: <b style="color:#D07268;">${fmt(debt)} so'm</b></p>
      <form id="payForm">
        <div class="field"><label>Sana</label><input type="date" id="paySana" value="${today()}"></div>
        <div class="field"><label>To'lov summasi (so'm)</label><input type="number" min="1" max="${debt}" id="payAmount" required placeholder="0"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="payCancel">Bekor qilish</button>
          <button type="submit" class="btn btn-primary">Saqlash</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
  
  document.getElementById('payCancel').addEventListener('click', function() {
    document.getElementById('payOverlay').remove();
    state.payModal = null;
  });
  
  document.getElementById('payOverlay').addEventListener('click', function(e) {
    if (e.target === this) { this.remove(); state.payModal = null; }
  });
  
  document.getElementById('payForm').addEventListener('submit', async e => {
    e.preventDefault();
    const sana = document.getElementById('paySana').value || today();
    const amount = Number(document.getElementById('payAmount').value);
    if (!amount || amount <= 0) return;
    try {
      await addPayment(state.payModal.customerId, sana, amount);
      document.getElementById('payOverlay').remove();
      state.payModal = null;
      await loadData();
      render();
      alert('To\'lov saqlandi.\nSana: '+sana+'\nSumma: '+fmt(amount)+' so\'m');
    } catch(err) { alert(err.message); }
  });
}

// ============ CHANGE LANG ============
function changeLang(l) { 
  lang = l; 
  localStorage.setItem('lang', lang); 
  render(); 
}
window.changeLang = changeLang;

// ============ LOAD DATA ============
async function loadData() {
  try {
    state.loading = true;
    const [customers, products, sales, payments, users] = await Promise.all([
      getCustomers().catch(()=>[]),
      getProducts().catch(()=>[]),
      getSales().catch(()=>[]),
      getPayments().catch(()=>[]),
      getUsers().catch(()=>[])
    ]);
    state.customers = customers;
    state.products = products;
    state.sales = sales;
    state.payments = payments;
    state.users = users;
    state.loaded = true;
    state.loading = false;
    state.error = null;
  } catch(err) {
    state.loading = false;
    state.error = err.message;
    render();
  }
}

// ============ INIT ============
(async function init() {
  try {
    const savedToken = localStorage.getItem('token');
    if (savedToken) {
      token = savedToken;
      try {
        const user = await getCurrentUser();
        if (user) {
          state.currentUser = user;
          await loadData();
          state.loaded = true;
          render();
          return;
        }
      } catch(e) {
        localStorage.removeItem('token');
        token = null;
        state.currentUser = null;
      }
    }
    state.loaded = true;
    render();
  } catch(e) {
    state.loaded = true;
    render();
  }
})();
</script>
