<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toys Note — Do'kon Boshqaruvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  /* ... STYLE LAR (OLDINGI KODDA QOLDI) ... */
  :root{
    --salad:#2F6FE4;
    --salad-dark:#1E54B7;
    --salad-light:#E7EEFC;
    --salad-pale:#F5F8FE;
    --ink:#20263A;
    --ink-soft:#77809C;
    --line:#E2E8F7;
    --white:#FFFFFF;
    --danger:#D64545;
    --danger-light:#FDEDEA;
    --amber:#E9A23B;
    --amber-light:#FCF1DF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--white);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3,.brand span{font-family:'Baloo 2',sans-serif;}
  #app{min-height:100vh;}
  svg{display:block;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--salad-pale);}
  .login-card{background:var(--white);width:380px;max-width:92vw;border-radius:24px;padding:36px 32px;box-shadow:0 20px 50px rgba(47,111,228,.16);border:1px solid var(--line);}
  .login-logo{width:52px;height:52px;margin-bottom:16px;}
  .login-card h1{font-size:26px;margin:0 0 4px;color:var(--ink);}
  .login-card p{margin:0 0 24px;color:var(--ink-soft);font-size:14px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  .field input:focus, .field select:focus{outline:none;border-color:var(--salad);}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:.15s transform;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--salad);color:#fff;width:100%;box-shadow:0 8px 18px rgba(47,111,228,.32);}
  .btn-primary:hover{background:var(--salad-dark);}
  .login-error{background:var(--danger-light);color:var(--danger);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;font-weight:600;}

  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;background:var(--white);border-right:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;padding:22px 14px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;font-size:19px;font-weight:700;color:var(--ink);}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink-soft);text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:4px;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--salad-pale);color:var(--ink);}
  .nav-item.active{background:var(--salad-light);color:var(--salad-dark);}
  .nav-item.active svg{stroke:var(--salad-dark);}
  .sidebar .spacer{flex:1;}
  .user-chip{padding:12px;border-radius:12px;background:var(--salad-pale);font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
  .user-chip b{color:var(--ink);display:block;font-size:14px;}
  .logout-btn{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);padding:9px;border-radius:10px;font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;width:100%;}
  .logout-btn:hover{border-color:var(--danger);color:var(--danger);}

  .main{flex:1;padding:30px 36px;overflow-x:hidden;background:var(--salad-pale);min-height:100vh;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
  .topbar h2{margin:0;font-size:24px;color:var(--ink);}
  .topbar p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;}

  .card{background:var(--white);border-radius:18px;padding:22px 24px;box-shadow:0 2px 10px rgba(30,50,110,.06);border:1px solid var(--line);margin-bottom:20px;}
  .card h3{margin:0 0 16px;font-size:16px;color:var(--ink);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}.sidebar{width:76px;}.nav-item span, .brand span, .user-chip{display:none;}}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;color:var(--ink-soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .pill-ok{background:var(--salad-light);color:var(--salad-dark);}
  .pill-debt{background:var(--amber-light);color:var(--amber);}
  .small-btn{border:none;background:var(--line);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
  .small-btn.danger{background:var(--danger-light);color:var(--danger);}
  .small-btn.pay{background:var(--salad-light);color:var(--salad-dark);}
  .small-btn:hover{filter:brightness(.95);}
  .actions-cell{display:flex;gap:6px;}

  .stat-card{background:var(--white);border-radius:16px;padding:18px 20px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(30,50,110,.06);}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .stat-card .val{font-family:'Baloo 2';font-size:26px;color:var(--ink);margin-top:6px;}
  .stat-card .icn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .stat-card .icn svg{width:16px;height:16px;}

  .chart-box{position:relative;height:260px;}
  .empty{color:var(--ink-soft);font-size:13.5px;padding:14px 4px;}
  .msg{padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:600;margin-bottom:14px;}
  .msg-ok{background:var(--salad-light);color:var(--salad-dark);}
  .msg-warn{background:var(--amber-light);color:var(--amber);}
  .row-flex{display:flex;gap:10px;align-items:end;flex-wrap:wrap;}
  .row-flex .field{flex:1;min-width:150px;margin-bottom:0;}
  .sale-total-box{background:var(--salad);color:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin:16px 0;flex-wrap:wrap;gap:12px;}
  .sale-total-box .t-lbl{font-size:13px;color:#DCE6FB;}
  .sale-total-box .t-val{font-family:'Baloo 2';font-size:24px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,50,38,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal-card{background:#fff;border-radius:18px;padding:26px 26px;width:360px;max-width:92vw;box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal-card h3{margin:0 0 14px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{width:auto;flex:1;}
  .btn-secondary{background:var(--line);color:var(--ink);}

  .loading-spinner{text-align:center;padding:40px;color:var(--ink-soft);}
  .loading-spinner::after{content:'';display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--salad);border-radius:50%;animation:spin 0.8s linear infinite;margin-left:10px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .artikul-badge{
    background:var(--salad-light);
    color:var(--salad-dark);
    padding:2px 10px;
    border-radius:12px;
    font-size:12px;
    font-weight:600;
    font-family:monospace;
  }
  .search-wrapper{position:relative;}
  .search-results-dropdown{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:white;
    border:2px solid var(--line);
    border-radius:12px;
    max-height:200px;
    overflow-y:auto;
    z-index:100;
    display:none;
    margin-top:4px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
  }
  .search-results-dropdown.show{display:block;}
  .search-result{
    cursor:pointer;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    transition:background .15s;
    font-size:14px;
  }
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:var(--salad-pale);}
  .search-result .artikul{font-weight:700;color:var(--salad-dark);}
</style>
</head>
<body>
<div id="app">
  <div class="loading-spinner">Yuklanmoqda...</div>
</div>

<script>
// ============ API KONFIGURATSIYA ============
const API_URL = '/api';
let token = localStorage.getItem('token');

// ============ STATE ============
function loadStateFromStorage() {
  try {
    const saved = localStorage.getItem('app_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      return {
        view: parsed.view || 'mijozlar',
        saleDraft: parsed.saleDraft || { sana: '', productId: '', customerId: '', soni: '', tolangan: '' },
        historyFilter: parsed.historyFilter || { sana: '', customerId: '' }
      };
    }
  } catch (e) {}
  return { view: 'mijozlar', saleDraft: { sana: '', productId: '', customerId: '', soni: '', tolangan: '' }, historyFilter: { sana: '', customerId: '' } };
}

function saveStateToStorage() {
  try {
    localStorage.setItem('app_state', JSON.stringify({
      view: state.view,
      saleDraft: state.saleDraft,
      historyFilter: state.historyFilter
    }));
  } catch (e) {}
}

let state = {
  loaded: false,
  loading: false,
  users: [],
  customers: [],
  products: [],
  sales: [],
  payments: [],
  currentUser: null,
  view: 'mijozlar',
  saleDraft: { sana: '', productId: '', customerId: '', soni: '', tolangan: '' },
  historyFilter: { sana: '', customerId: '' },
  loginErr: '',
  payModal: null,
  error: null,
  searchResults: [],
  showSearchResults: false,
  searchQuery: ''
};

// Saved state ni yuklash
const savedState = loadStateFromStorage();
state.view = savedState.view;
state.saleDraft = savedState.saleDraft;
state.historyFilter = savedState.historyFilter;

// ============ API FUNKSIYALAR ============
async function apiRequest(endpoint, options = {}) {
  const headers = {
    'Content-Type': 'application/json',
    ...options.headers
  };
  
  if (token) {
    headers['Authorization'] = `Bearer ${token}`;
  }

  try {
    const response = await fetch(`${API_URL}${endpoint}`, {
      ...options,
      headers
    });

    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.error || `So'rov xatosi: ${response.status}`);
    }

    return response.json();
  } catch (error) {
    if (error.message.includes('Failed to fetch')) {
      throw new Error('Serverga ulanish mumkin emas');
    }
    throw error;
  }
}

// Auth
async function loginUser(login, password) {
  const data = await apiRequest('/auth/login', {
    method: 'POST',
    body: JSON.stringify({ login, password })
  });
  token = data.token;
  localStorage.setItem('token', token);
  return data.user;
}

async function getCurrentUser() {
  if (!token) return null;
  return apiRequest('/auth/me');
}

// Users
async function getUsers() { return apiRequest('/users'); }
async function registerUser(login, password, role = 'user') {
  return apiRequest('/users/register', {
    method: 'POST',
    body: JSON.stringify({ login, password, role })
  });
}
async function deleteUser(login) {
  return apiRequest(`/users/${login}`, { method: 'DELETE' });
}

// Customers
async function getCustomers() { return apiRequest('/customers'); }
async function addCustomer(name, phone) {
  return apiRequest('/customers', {
    method: 'POST',
    body: JSON.stringify({ name, phone })
  });
}
async function deleteCustomer(id) {
  return apiRequest(`/customers/${id}`, { method: 'DELETE' });
}

// Products
async function getProducts() { return apiRequest('/products'); }
async function searchProducts(query) {
  if (!query || query.length < 1) return getProducts();
  return apiRequest(`/products/search/${encodeURIComponent(query)}`);
}
async function addProduct(name, narx) {
  return apiRequest('/products', {
    method: 'POST',
    body: JSON.stringify({ name, narx })
  });
}
async function deleteProduct(id) {
  return apiRequest(`/products/${id}`, { method: 'DELETE' });
}

// Sales
async function getSales() { return apiRequest('/sales'); }
async function addSale(saleData) {
  return apiRequest('/sales', {
    method: 'POST',
    body: JSON.stringify(saleData)
  });
}

// Payments
async function addPayment(customerId, sana, amount) {
  return apiRequest('/payments', {
    method: 'POST',
    body: JSON.stringify({ customerId, sana, amount })
  });
}

// ============ ICONS ============

function fmt(n) { return Math.round(n || 0).toLocaleString('ru-RU'); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');
  if (state.loading) {
    app.innerHTML = `<div class="loading-spinner">Yuklanmoqda...</div>`;
    return;
  }
  if (!state.loaded) {
    app.innerHTML = `<div class="loading-spinner">Ma'lumotlar yuklanmoqda...</div>`;
    return;
  }
  if (!state.currentUser) {
    app.innerHTML = renderLogin();
    attachLoginEvents();
    return;
  }
  if (state.error) {
    app.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger);">
      <h3>Xatolik yuz berdi</h3>
      <p>${state.error}</p>
      <button onclick="location.reload()" class="btn btn-primary" style="width:auto;margin-top:20px;">Qayta yuklash</button>
    </div>`;
    return;
  }
  app.innerHTML = renderShell() + (state.payModal ? renderPayModal() : '');
  attachShellEvents();
  if (state.payModal) attachPayModalEvents();
  if (state.view === 'statistika') {
    setTimeout(drawStatCharts, 200);
  }
  
  // State ni saqlash
  saveStateToStorage();
}

// ============ LOGIN ============
function renderLogin() {
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">${ICONS.logo}</div>
      <h1>Toys Note</h1>
      <p>Do'kon boshqaruv tizimiga kirish</p>
      ${state.loginErr ? `<div class="login-error">${state.loginErr}</div>` : ''}
      <form id="loginForm">
        <div class="field"><label>Login</label><input id="loginInput" autocomplete="username" required value="baxrom"></div>
        <div class="field"><label>Parol</label><input id="parolInput" type="password" autocomplete="current-password" required value="14042011"></div>
        <button class="btn btn-primary" type="submit">Kirish</button>
      </form>
      <p style="margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:center;">Admin: baxrom / 14042011</p>
    </div>
  </div>`;
}

function attachLoginEvents() {
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const login = document.getElementById('loginInput').value.trim();
    const parol = document.getElementById('parolInput').value;
    state.loading = true;
    state.loginErr = '';
    render();
    try {
      const user = await loginUser(login, parol);
      state.currentUser = user;
      await loadData();
      state.loaded = true;
      state.loading = false;
      render();
    } catch (error) {
      state.loading = false;
      state.loginErr = error.message || "Login yoki parol noto'g'ri.";
      render();
    }
  });
}

// ============ SHELL ============
const NAV = [
  { id: 'mijozlar', label: 'Mijozlar', icon: ICONS.users },
  { id: 'mahsulot', label: 'Mahsulot', icon: ICONS.box },
  { id: 'sotuv', label: 'Sotuv', icon: ICONS.cart },
  { id: 'statistika', label: 'Statistika', icon: ICONS.chart },
  { id: 'tarix', label: 'Tarix', icon: ICONS.history },
];

function renderShell() {
  const isAdmin = state.currentUser?.role === 'admin';
  const navItems = NAV.map(n => `
    <div class="nav-item ${state.view === n.id ? 'active' : ''}" data-nav="${n.id}">
      ${n.icon}<span>${n.label}</span>
    </div>`).join('');
  const adminNav = isAdmin ? `<div class="nav-item ${state.view === 'foydalanuvchilar' ? 'active' : ''}" data-nav="foydalanuvchilar">
      ${ICONS.gear}<span>Foydalanuvchilar</span></div>` : '';
  return `
  <div class="shell">
    <div class="sidebar">
      <div class="brand">${ICONS.logo}<span>Toys Note</span></div>
      ${navItems}${adminNav}
      <div class="spacer"></div>
      <div class="user-chip"><b>${state.currentUser?.login || ''}</b>${isAdmin ? ' Administrator' : ' Xodim'}</div>
      <button class="logout-btn" id="logoutBtn">Chiqish</button>
    </div>
    <div class="main">${renderView()}</div>
  </div>`;
}

function renderView() {
  switch (state.view) {
    case 'mijozlar': return viewMijozlar();
    case 'mahsulot': return viewMahsulot();
    case 'sotuv': return viewSotuv();
    case 'statistika': return viewStatistika();
    case 'tarix': return viewTarix();
    case 'foydalanuvchilar': return viewFoydalanuvchilar();
    default: return '';
  }
}

function attachShellEvents() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      state.view = el.getAttribute('data-nav');
      saveStateToStorage();
      render();
    });
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    state.currentUser = null;
    token = null;
    localStorage.removeItem('token');
    localStorage.removeItem('app_state');
    state.loaded = false;
    render();
  });
  attachViewEvents();
}

// ============ MA'LUMOTLARNI YUKLASH ============
async function loadData() {
  try {
    state.loading = true;
    const [customers, products, sales, users] = await Promise.all([
      getCustomers().catch(() => []),
      getProducts().catch(() => []),
      getSales().catch(() => []),
      getUsers().catch(() => [])
    ]);
    state.customers = customers;
    state.products = products;
    state.sales = sales;
    state.users = users;
    state.loaded = true;
    state.loading = false;
    state.error = null;
  } catch (error) {
    state.loading = false;
    state.error = error.message;
    render();
  }
}

// ============ MIJOZLAR ============
function getCustomerDebtLocal(customerId) {
  const sales = state.sales.filter(s => s.customerId === customerId);
  const totalDebt = sales.reduce((sum, s) => sum + (s.qarz || 0), 0);
  const payments = state.payments.filter(p => p.customerId === customerId);
  const totalPaid = payments.reduce((sum, p) => sum + p.amount, 0);
  return Math.max(0, totalDebt - totalPaid);
}

function viewMijozlar() {
  const rows = state.customers.map(c => {
    const debt = getCustomerDebtLocal(c._id);
    return `<tr>
      <td>${c.name}</td><td>${c.phone || '—'}</td>
      <td>${debt > 0 ? `<span class="pill pill-debt">${fmt(debt)} so'm qarz</span>` : `<span class="pill pill-ok">Qarzi yo'q</span>`}</td>
      <td class="actions-cell">
        ${debt > 0 ? `<button class="small-btn pay" data-pay-customer="${c._id}">Qarz to'lash</button>` : ''}
        <button class="small-btn danger" data-del-customer="${c._id}">O'chirish</button>
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="topbar"><div><h2>Mijozlar</h2><p>Do'konga tegishli barcha mijozlar ro'yxati</p></div></div>
  <div class="card">
    <h3>Yangi mijoz qo'shish</h3>
    <form id="customerForm" class="row-flex">
      <div class="field"><label>Ism-familiya</label><input id="custName" required placeholder="Masalan: Aziz Karimov"></div>
      <div class="field"><label>Telefon (ixtiyoriy)</label><input id="custPhone" type="tel" placeholder="+998 90 123 45 67"></div>
      <button class="btn btn-primary" type="submit">Qo'shish</button>
    </form>
  </div>
  <div class="card">
    <h3>Mijozlar ro'yxati (${state.customers.length})</h3>
    ${state.customers.length ? `<table><thead><tr><th>Ism</th><th>Telefon</th><th>Holati</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">Hali mijoz qo'shilmagan.</div>`}
  </div>`;
}

// ============ PAY MODAL ============
function renderPayModal() {
  const c = state.customers.find(x => x._id === state.payModal.customerId);
  if (!c) return '';
  const debt = getCustomerDebtLocal(c._id);
  return `
  <div class="modal-overlay" id="payOverlay">
    <div class="modal-card">
      <h3>Qarz to'lash — ${c.name}</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:-8px;">Joriy qarz: <b style="color:var(--amber)">${fmt(debt)} so'm</b></p>
      <form id="payForm">
        <div class="field"><label>Sana</label><input type="date" id="paySana" value="${todayStr()}"></div>
        <div class="field"><label>To'lov summasi (so'm)</label><input type="number" min="1" max="${debt}" id="payAmount" required placeholder="0"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="payCancelBtn">Bekor qilish</button>
          <button type="submit" class="btn btn-primary">Saqlash</button>
        </div>
      </form>
    </div>
  </div>`;
}

function attachPayModalEvents() {
  document.getElementById('payCancelBtn').addEventListener('click', () => { state.payModal = null; render(); });
  document.getElementById('payOverlay').addEventListener('click', e => { if (e.target.id === 'payOverlay') { state.payModal = null; render(); } });
  document.getElementById('payForm').addEventListener('submit', async e => {
    e.preventDefault();
    const sana = document.getElementById('paySana').value || todayStr();
    const amount = Number(document.getElementById('payAmount').value);
    if (!amount || amount <= 0) return;
    try {
      await addPayment(state.payModal.customerId, sana, amount);
      state.payModal = null;
      await loadData();
      render();
    } catch (error) {
      alert(error.message);
    }
  });
}

  });

    <div class="stat-card"><div class="icn" style="background:var(--salad-light);color:var(--salad-dark)">${ICONS.check}</div><div class="lbl">Qabul qilingan pul</div><div class="val">${fmt(totalPaid)} so'm</div></div>

  </div>
  <div class="grid-2">
    <div class="card"><h3>Eng ko'p xarid qilgan mijozlar</h3><div class="chart-box"><canvas id="chartCustomers"></canvas></div></div>
    <div class="card"><h3>Mijozlar bo'yicha qarzdorlik</h3><div class="chart-box"><canvas id="chartDebt"></canvas></div></div>
  </div>`;
}

let chartInstances = [];
function destroyCharts() { chartInstances.forEach(c => { try { c.destroy(); } catch (e) {} }); chartInstances = []; }

function drawStatCharts() {
  if (state.view !== 'statistika' || typeof Chart === 'undefined') return;
  destroyCharts();
  const palette = ['#2F6FE4', '#7DA6F5', '#1E54B7', '#E9A23B', '#9CB9EE', '#D64545'];

  const byDay = {};
  state.sales.forEach(s => { byDay[s.sana] = (byDay[s.sana] || 0) + s.jami; });
  const days = Object.keys(byDay).sort();
  const dailyCtx = document.getElementById('chartDaily');
  if (dailyCtx && days.length) {
    chartInstances.push(new Chart(dailyCtx, {
      type: 'line',
      data: { labels: days, datasets: [{ label: "Savdo (so'm)", data: days.map(d => byDay[d]), borderColor: '#2F6FE4', backgroundColor: 'rgba(47,111,228,.14)', fill: true, tension: .3 }] },
      options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
    }));
  } else if (dailyCtx) {
    dailyCtx.parentElement.innerHTML = '<div class="empty">Hali sotuvlar mavjud emas.</div>';
  }

  const byProd = {};
  state.sales.forEach(s => { const p = state.products.find(x => x._id === s.productId); const name = p ? p.name : '—'; byProd[name] = (byProd[name] || 0) + s.soni; });
  const prodCtx = document.getElementById('chartProducts');
  if (prodCtx) {
    const labels = Object.keys(byProd);
    if (labels.length) {
      chartInstances.push(new Chart(prodCtx, {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Dona', data: labels.map(l => byProd[l]), backgroundColor: labels.map((_, i) => palette[i % palette.length]) }] },
        options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
      }));
    } else {
      prodCtx.parentElement.innerHTML = '<div class="empty">Hali sotuvlar mavjud emas.</div>';
    }
  }

  const byCust = {};
  state.sales.forEach(s => { const c = state.customers.find(x => x._id === s.customerId); const name = c ? c.name : '—'; byCust[name] = (byCust[name] || 0) + s.jami; });
  const custCtx = document.getElementById('chartCustomers');
  if (custCtx) {
    const labels = Object.keys(byCust).sort((a, b) => byCust[b] - byCust[a]).slice(0, 8);
    if (labels.length) {
      chartInstances.push(new Chart(custCtx, {
        type: 'bar',
        data: { labels, datasets: [{ label: "So'm", data: labels.map(l => byCust[l]), backgroundColor: '#3A8CF0' }] },
        options: { indexAxis: 'y', plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
      }));
    } else {
      custCtx.parentElement.innerHTML = '<div class="empty">Hali sotuvlar mavjud emas.</div>';
    }
  }

  const byDebt = {};
  state.customers.forEach(c => { const d = getCustomerDebtLocal(c._id); if (d > 0) byDebt[c.name] = d; });
  const debtCtx = document.getElementById('chartDebt');
  if (debtCtx) {
    const labels = Object.keys(byDebt);
    if (labels.length) {
      chartInstances.push(new Chart(debtCtx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: labels.map(l => byDebt[l]), backgroundColor: labels.map((_, i) => palette[i % palette.length]) }] },
        options: { responsive: true, maintainAspectRatio: false }
      }));
    } else {
      debtCtx.parentElement.innerHTML = '<div class="empty">Qarzdorlik mavjud emas.</div>';
    }
  }
}

// ============ TARIX ============
function viewTarix() {
  const f = state.historyFilter;
  const customerOptions = state.customers.map(c => `<option value="${c._id}" ${f.customerId === c._id ? 'selected' : ''}>${c.name}</option>`).join('');
  let resultsHtml = '';
  
  if (f.customerId) {
    // Sana formatini to'g'rilash
    let filterSana = f.sana;
    if (filterSana) {
      // 04.06.2026 -> 2026-06-04 formatiga o'tkazish
      const parts = filterSana.split('.');
      if (parts.length === 3) {
        filterSana = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }
    }
    
    // Sotuvlarni filtrlash
    let matches = state.sales.filter(s => s.customerId === f.customerId);
    
    // Sana bo'yicha filtr (agar sana kiritilgan bo'lsa)
    if (filterSana) {
      matches = matches.filter(s => s.sana === filterSana);
    }
    
    // Tarix bo'yicha tartiblash (eng yangisi birinchi)
    matches.sort((a, b) => b.createdAt - a.createdAt);
    
    const totalJami = matches.reduce((a, s) => a + s.jami, 0);
    const totalTolangan = matches.reduce((a, s) => a + s.tolangan, 0);
    const totalQarz = matches.reduce((a, s) => a + s.qarz, 0);
    
    // Qarz to'lovlarini olish
    const payments = state.payments.filter(p => p.customerId === f.customerId);
    const totalPayments = payments.reduce((a, p) => a + p.amount, 0);
    
    if (matches.length > 0 || payments.length > 0) {
      // Sotuvlar jadvali
      let rows = matches.map(s => {
        const p = state.products.find(x => x._id === s.productId);
        // Sana formatini o'zgartirish (2026-06-04 -> 04.06.2026)
        const dateParts = s.sana.split('-');
        const formattedDate = dateParts.length === 3 ? `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}` : s.sana;
        
        return `<tr>
          <td>${formattedDate}</td>
          <td>${p ? p.name : '—'}</td>
          <td>${s.soni} dona</td>
          <td>${fmt(s.jami)} so'm</td>
          <td>${fmt(s.tolangan)} so'm</td>
          <td>${s.qarz > 0 ? `<span class="pill pill-debt">${fmt(s.qarz)} so'm</span>` : `<span class="pill pill-ok">To'liq</span>`}</td>
        </tr>`;
      }).join('');
      
      // Qarz to'lovlari jadvali
      let paymentRows = payments.map(p => {
        const dateParts = p.sana.split('-');
        const formattedDate = dateParts.length === 3 ? `${dateParts[2]}.${dateParts[1]}.${dateParts[0]}` : p.sana;
        return `<tr>
          <td>${formattedDate}</td>
          <td colspan="3">💳 Qarz to'lovi</td>
          <td colspan="2"><span class="pill pill-ok">${fmt(p.amount)} so'm</span></td>
        </tr>`;
      }).join('');
      
      resultsHtml = `
        <table>
          <thead>
            <tr>
              <th>Sana</th>
              <th>Mahsulot</th>
              <th>Soni</th>
              <th>Jami</th>
              <th>To'langan</th>
              <th>Qarz</th>
            </tr>
          </thead>
          <tbody>${rows}${paymentRows}</tbody>
        </table>
        <div class="sale-total-box" style="margin-top:18px">
          <div>
            <div class="t-lbl">Jami xarid</div>
            <div class="t-val">${fmt(totalJami)} so'm</div>
          </div>
          <div>
            <div class="t-lbl">To'langan</div>
            <div class="t-val">${fmt(totalTolangan)} so'm</div>
          </div>
          <div>
            <div class="t-lbl">Qarz</div>
            <div class="t-val">${fmt(totalQarz)} so'm</div>
          </div>
          ${totalPayments > 0 ? `<div>
            <div class="t-lbl">Qarz to'lovi</div>
            <div class="t-val">${fmt(totalPayments)} so'm</div>
          </div>` : ''}
        </div>
      `;
    } else {
      resultsHtml = `<div class="empty">Bu mijoz bo'yicha hech qanday ma'lumot topilmadi.</div>`;
    }
  } else {
    resultsHtml = `<div class="empty">Natijalarni ko'rish uchun mijozni tanlang.</div>`;
  }
  
  return `
  <div class="topbar">
    <div>
      <h2>Tarix</h2>
      <p>Sana va mijoz bo'yicha xaridlar tarixi</p>
    </div>
  </div>
  <div class="card">
    <div class="row-flex">
      <div class="field">
        <label>Sana</label>
        <input type="date" id="histSana" value="${f.sana || ''}">
      </div>
      <div class="field">
        <label>Mijoz</label>
        <select id="histCustomer">
          <option value="">— tanlang —</option>
          ${customerOptions}
        </select>
      </div>
      <button class="btn btn-primary" id="histShowBtn" style="width:auto;padding:12px 24px;">Ko'rsatish</button>
      <button class="btn btn-secondary" id="histClearBtn" style="width:auto;padding:12px 24px;">Tozalash</button>
    </div>
  </div>
  <div class="card">
    <h3>Natija</h3>
    ${resultsHtml}
  </div>`;
}

    <form id="userForm" class="row-flex">
      <div class="field"><label>Login</label><input id="newLogin" required></div>
      <div class="field"><label>Parol</label><input id="newParol" required></div>
      <button class="btn btn-primary" type="submit">Qo'shish</button>
    </form>
  </div>
  <div class="card"><h3>Foydalanuvchilar ro'yxati</h3><table><thead><tr><th>Login</th><th>Rol</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ============ VIEW EVENTS ============
function attachViewEvents() {
  // Customers
  const custForm = document.getElementById('customerForm');
  if (custForm) {
    custForm.addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      if (!name) return;
      try {
        await addCustomer(name, phone);
        await loadData();
        render();
      } catch (error) {
        alert(error.message);
      }
    });
  }

  document.querySelectorAll('[data-del-customer]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del-customer');
      if (!confirm("Bu mijozni o'chirishni tasdiqlaysizmi?")) return;
      try {
        await deleteCustomer(id);
        await loadData();
        render();
      } catch (error) {
        alert(error.message);
      }
    });
  });

  document.querySelectorAll('[data-pay-customer]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.payModal = { customerId: btn.getAttribute('data-pay-customer') };
      render();
    });
  });

  // Products
  const prodForm = document.getElementById('productForm');
  if (prodForm) {
    prodForm.addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('prodName').value.trim();
      const narx = Number(document.getElementById('prodNarx').value);
      if (!name || !narx) return;
      try {
        const result = await addProduct(name, narx);
        alert(`✅ Mahsulot qo'shildi!\nArtikul: ${result.artikul}\nNomi: ${result.name}\nNarxi: ${fmt(result.narx)} so'm`);
        await loadData();
        render();
      } catch (error) {
        alert(error.message);
      }
    });
  }

  document.querySelectorAll('[data-del-product]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del-product');
      if (!confirm("Bu mahsulotni o'chirishni tasdiqlaysizmi?")) return;
      try {
        await deleteProduct(id);
        await loadData();
        render();
      } catch (error) {
        alert(error.message);
      }
    });
  });

  // ============ SALES EVENTS ============
const saleForm = document.getElementById('saleForm');
if (saleForm) {
  const searchInput = document.getElementById('saleProductSearch');
  const productHidden = document.getElementById('saleProduct');

  if (searchInput) {
    let searchTimeout;
    searchInput.addEventListener('input', async function() {
      const query = this.value.trim();
      state.searchQuery = query;
      
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        if (query.length > 0) {
          try {
            const results = await searchProducts(query);
            state.searchResults = results;
            state.showSearchResults = results.length > 0;
            render();
          } catch (error) {
            console.error('Qidiruv xatosi:', error);
          }
        } else {
          state.searchResults = [];
          state.showSearchResults = false;
          render();
        }
      }, 300);
    });

    document.addEventListener('click', function(e) {
      const result = e.target.closest('.search-result');
      if (result) {
        const productId = result.dataset.productId;
        const productName = result.dataset.productName;
        const productNarx = result.dataset.productNarx;
        const productArtikul = result.dataset.productArtikul;
        
        productHidden.value = productId;
        searchInput.value = `${productArtikul || 'No ART'} - ${productName}`;
        state.searchResults = [];
        state.showSearchResults = false;
        state.searchQuery = '';
        state.saleDraft.productId = productId;
        
        render();
        
        setTimeout(() => {
          const event = new Event('input');
          document.getElementById('saleSoni')?.dispatchEvent(event);
        }, 100);
      }
    });
  }

  const updateSaleComputed = () => {
    state.saleDraft = {
      sana: document.getElementById('saleSana').value,
      customerId: document.getElementById('saleCustomer').value,
      productId: document.getElementById('saleProduct').value,
      soni: document.getElementById('saleSoni').value,
      tolangan: document.getElementById('saleTolangan').value,
    };
    const f = computeSaleFigures(state.saleDraft);
    document.getElementById('saleJamiVal').textContent = fmt(f.jami) + " so'm";
    document.getElementById('salePerUnitVal').textContent = (f.product ? fmt(f.product.narx) : 0) + " so'm";
    const qarzEl = document.getElementById('saleQarzVal');
    qarzEl.value = fmt(f.qarz) + " so'm";
    qarzEl.style.background = f.qarz > 0 ? 'var(--amber-light)' : 'var(--salad-light)';
    qarzEl.style.color = f.qarz > 0 ? 'var(--amber)' : 'var(--salad-dark)';
  };

  ['saleSana', 'saleCustomer', 'saleSoni', 'saleTolangan'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const evt = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
    el.addEventListener(evt, updateSaleComputed);
  });

  saleForm.addEventListener('submit', async e => {
    e.preventDefault();
    const d = state.saleDraft;
    
    console.log('📤 Sotuv yuborilmoqda:', d);
    
    if (!d.customerId || !d.productId || !d.soni || Number(d.soni) <= 0) {
      alert("Iltimos mijoz, mahsulot va sonini to'g'ri kiriting.");
      return;
    }
    
    try {
      const saleData = {
        sana: d.sana || todayStr(),
        customerId: d.customerId,
        productId: d.productId,
        soni: Number(d.soni),
        tolangan: Number(d.tolangan || 0)
      };
      
      console.log('📤 API ga yuborilmoqda:', saleData);
      
      const result = await addSale(saleData);
      console.log('✅ Sotuv saqlandi:', result);
      
      state.saleDraft = { sana: todayStr(), productId: '', customerId: '', soni: '', tolangan: '' };
      state.searchQuery = '';
      state.searchResults = [];
      state.showSearchResults = false;
      if (searchInput) searchInput.value = '';
      if (productHidden) productHidden.value = '';
      
      await loadData();
      render();
      
      alert(`✅ Sotuv muvaffaqiyatli saqlandi!\nJami: ${fmt(result.jami)} so'm\nQarz: ${fmt(result.qarz)} so'm`);
      
    } catch (error) {
      console.error('❌ Sotuv xatosi:', error);
      alert('Xatolik: ' + error.message);
    }
  });
}

  // History
  const histSana = document.getElementById('histSana');
  const histCustomer = document.getElementById('histCustomer');
  const histBtn = document.getElementById('histShowBtn');
  if (histBtn) {
    histBtn.addEventListener('click', () => {
      state.historyFilter = { sana: histSana.value, customerId: histCustomer.value };
      render();
    });
  }

  // Users
  const userForm = document.getElementById('userForm');
  if (userForm) {
    userForm.addEventListener('submit', async e => {
      e.preventDefault();
      const login = document.getElementById('newLogin').value.trim();
      const parol = document.getElementById('newParol').value;
      if (!login || !parol) return;
      try {
        await registerUser(login, parol);
        await loadData();
        render();
      } catch (error) {
        alert(error.message);
      }
    });
  }

  document.querySelectorAll('[data-del-user]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const login = btn.getAttribute('data-del-user');
      if (!confirm("Bu foydalanuvchini o'chirishni tasdiqlaysizmi?")) return;
      try {
        await deleteUser(login);
        await loadData();
        render();
      } catch (error) {
        alert(error.message);
      }
    });
  });
}

// ============ INIT ============
(async function init() {
  try {
    const savedToken = localStorage.getItem('token');
    
    if (savedToken) {
      token = savedToken;
      try {
        // Token ni tekshirish
        const user = await getCurrentUser();
        if (user) {
          state.currentUser = user;
          await loadData();
          state.loaded = true;
          render();
          return;
        }
      } catch (error) {
        console.log('Token eskirgan:', error.message);
        localStorage.removeItem('token');
        localStorage.removeItem('app_state');
        token = null;
        state.currentUser = null;
      }
    }
    
    state.loaded = true;
    render();
  } catch (error) {
    console.error('Init xatosi:', error);
    state.loaded = true;
    render();
  }
})();
  // Mahsulot qo'shish funksiyasi
async function addProduct(name, narx) {
  try {
    const response = await fetch('/api/products', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ name, narx })
    });
    
    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error || 'Xatolik yuz berdi');
    }
    
    const data = await response.json();
    console.log('✅ Mahsulot qo\'shildi:', data);
    return data;
  } catch (error) {
    console.error('❌ Xatolik:', error);
    throw error;
  }
}

  const narx = Number(document.getElementById('prodNarx').value);
  
  if (!name || !narx) {
    alert('Iltimos, nom va narxni kiriting');

  }
  
  try {

    document.getElementById('prodName').value = '';
    document.getElementById('prodNarx').value = '';
    await loadData();
    render();
  } catch (error) {
    alert(error.message);
  }
});
