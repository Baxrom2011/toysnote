<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toys Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============ ROOT ============ */
:root {
  --primary: #4A90D9;
  --primary-light: #6BB5FF;
  --secondary: #2ECC71;
  --accent: #F39C12;
  --bg: #0A1628;
  --card-bg: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.08);
  --text: #FFFFFF;
  --text-secondary: rgba(255,255,255,0.7);
  --text-muted: rgba(255,255,255,0.4);
  --radius: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --glass: rgba(255,255,255,0.03);
}

/* ============ GLASS / SHISHA EFFEKT ============ */
.glass {
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.glass:hover {
  border-color: rgba(74, 144, 217, 0.2);
}

/* ============ FON ============ */
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0A1628 0%, #1A2A4A 50%, #0A1628 100%);
  color: var(--text);
  min-height: 100vh;
  transition: all 0.4s ease;
  background-attachment: fixed;
}

/* ============ LIGHT THEME ============ */
body.light {
  background: linear-gradient(135deg, #E8F0FE 0%, #D4E4F7 50%, #E8F0FE 100%);
  --text: #1A2A4A;
  --text-secondary: rgba(26,42,74,0.7);
  --text-muted: rgba(26,42,74,0.4);
  --card-bg: rgba(255,255,255,0.7);
  --border: rgba(26,42,74,0.08);
  --glass: rgba(255,255,255,0.5);
  --shadow: 0 8px 32px rgba(26,42,74,0.1);
}
body.light .card{background:rgba(255,255,255,0.7);}
body.light input,body.light select{background:rgba(255,255,255,0.8);color:#1A2A4A;border-color:rgba(26,42,74,0.1);}
body.light .header{background:rgba(255,255,255,0.7);}
body.light .login-card{background:rgba(255,255,255,0.85);}
body.light .login-card input{background:rgba(255,255,255,0.8);color:#1A2A4A;}
body.light .nav button{color:rgba(26,42,74,0.5);}
body.light .nav button:hover{color:#1A2A4A;}
body.light .nav button.active{background:rgba(74,144,217,0.08);color:#4A90D9;}
body.light .sale-box{background:rgba(0,0,0,0.02);border-color:rgba(26,42,74,0.06);}
body.light .sale-box .val{color:#1A2A4A;}
body.light .user-name{color:#1A2A4A;}
body.light .search-dropdown{background:#fff;}
body.light .modal-card{background:#fff;}
body.light .modal-card h3{color:#1A2A4A;}
body.light .badge{background:rgba(74,144,217,0.08);}
body.light .pill-ok{background:rgba(46,204,113,0.08);}
body.light .pill-debt{background:rgba(231,76,60,0.08);}
body.light .glass{background:rgba(255,255,255,0.5);}

/* ============ CLASSIC THEME ============ */
body.classic {
  background: linear-gradient(135deg, #F5F0E8 0%, #E8E0D5 50%, #F5F0E8 100%);
  --text: #3D2B1F;
  --text-secondary: rgba(61,43,31,0.7);
  --text-muted: rgba(61,43,31,0.4);
  --primary: #8B7355;
  --primary-light: #A68B6E;
  --secondary: #2C3E50;
  --accent: #C0392B;
  --card-bg: rgba(255,248,240,0.8);
  --border: rgba(139,115,85,0.1);
  --glass: rgba(255,248,240,0.6);
  --shadow: 0 8px 32px rgba(139,115,85,0.1);
}
body.classic .card{background:rgba(255,248,240,0.85);}
body.classic input,body.classic select{background:rgba(255,248,240,0.85);color:#3D2B1F;border-color:rgba(139,115,85,0.15);}
body.classic .header{background:rgba(255,248,240,0.85);}
body.classic .login-card{background:rgba(255,248,240,0.9);}
body.classic .login-card input{background:rgba(255,248,240,0.85);color:#3D2B1F;}
body.classic .nav button{color:rgba(61,43,31,0.5);}
body.classic .nav button:hover{color:#3D2B1F;}
body.classic .nav button.active{background:rgba(139,115,85,0.08);color:#8B7355;}
body.classic .sale-box{background:rgba(0,0,0,0.02);border-color:rgba(139,115,85,0.08);}
body.classic .sale-box .val{color:#3D2B1F;}
body.classic .user-name{color:#3D2B1F;}
body.classic .search-dropdown{background:#F5F0E8;}
body.classic .modal-card{background:#F5F0E8;}
body.classic .modal-card h3{color:#3D2B1F;}
body.classic .badge{background:rgba(139,115,85,0.08);}
body.classic .pill-ok{background:rgba(44,62,80,0.08);}
body.classic .pill-debt{background:rgba(192,57,43,0.08);}
body.classic .glass{background:rgba(255,248,240,0.6);}
body.classic .logo .gradient{background:linear-gradient(135deg,#8B7355,#2C3E50,#C0392B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;min-height:100vh;transition:all 0.4s ease;}
.container{max-width:1200px;margin:0 auto;padding:16px;}

/* ============ HEADER ============ */
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-radius:var(--radius);margin-bottom:16px;flex-wrap:wrap;gap:10px;transition:all 0.4s ease;background:var(--card-bg);backdrop-filter:blur(20px);border:1px solid var(--border);}
.logo{font-size:22px;font-weight:700;font-family:'Baloo 2',sans-serif;display:flex;align-items:center;gap:8px;color:var(--text);}
.logo .icon{font-size:26px;}
.logo .gradient{background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav{display:flex;gap:4px;flex-wrap:wrap;}
.nav button{padding:6px 14px;border:none;border-radius:8px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.3s;font-size:12px;font-weight:500;font-family:'Inter',sans-serif;}
.nav button:hover{background:rgba(255,255,255,0.05);color:var(--text);}
.nav button.active{background:rgba(74,144,217,0.12);color:var(--primary);border:1px solid rgba(74,144,217,0.15);}
.card{background:var(--card-bg);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;transition:all 0.4s ease;}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text);}
.card:hover{border-color:rgba(74,144,217,0.15);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:768px){.grid{grid-template-columns:1fr;}}
input,select{width:100%;padding:10px 14px;border-radius:10px;border:2px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:14px;font-family:'Inter',sans-serif;transition:all 0.3s;}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,144,217,0.1);}
label{display:block;color:var(--text-secondary);font-size:12px;font-weight:500;margin-bottom:4px;}
.btn{padding:8px 18px;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:all 0.3s;font-size:13px;font-family:'Inter',sans-serif;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(74,144,217,0.3);}
.btn-danger{background:rgba(231,76,60,0.1);color:#E74C3C;}
.btn-danger:hover{background:rgba(231,76,60,0.2);}
.btn-pay{background:rgba(46,204,113,0.1);color:#2ECC71;}
.btn-pay:hover{background:rgba(46,204,113,0.2);}
.btn-secondary{background:rgba(255,255,255,0.05);color:var(--text-secondary);border:1px solid var(--border);}
.btn-secondary:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-edit{background:rgba(243,156,18,0.1);color:#F39C12;}
.btn-edit:hover{background:rgba(243,156,18,0.2);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.02);color:var(--text-secondary);font-size:13px;}
tr:hover td{background:rgba(255,255,255,0.01);}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.pill-ok{background:rgba(46,204,113,0.1);color:#2ECC71;}
.pill-debt{background:rgba(231,76,60,0.1);color:#E74C3C;}
.badge{background:rgba(74,144,217,0.08);color:var(--primary);padding:2px 8px;border-radius:6px;font-size:11px;font-family:monospace;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row .field{flex:1;min-width:120px;}
.loading{text-align:center;padding:40px;color:var(--text-muted);font-size:16px;}
.loading::after{content:'...';animation:dots 1s steps(4) infinite;}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);transition:background 0.4s ease;}
.login-card{width:400px;max-width:100%;padding:36px;border-radius:var(--radius);text-align:center;transition:all 0.4s ease;background:var(--card-bg);backdrop-filter:blur(20px);border:1px solid var(--border);}
.login-card .logo-big{font-size:48px;margin-bottom:10px;}
.login-card h1{font-size:28px;background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;font-family:'Baloo 2',sans-serif;}
.login-card .subtitle{color:var(--text-secondary);font-size:14px;margin-bottom:18px;}
.login-error{background:rgba(231,76,60,0.08);color:#E74C3C;padding:10px;border-radius:10px;margin-bottom:14px;font-size:13px;}
.login-card .field input{background:rgba(255,255,255,0.04);border:2px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);width:100%;font-size:14px;transition:all 0.3s;}
.login-card .field input:focus{outline:none;border-color:var(--primary);}
.login-card .field label{text-align:left;}
.lang-select{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;width:100%;transition:all 0.3s;}

/* ============ ANIMATSIYA ============ */
@keyframes bookOpen{
  0%{transform:rotateY(-90deg) scale(0.5);opacity:0;}
  100%{transform:rotateY(0) scale(1);opacity:1;}
}
@keyframes bookClose{
  0%{transform:rotateY(0) scale(1);opacity:1;}
  100%{transform:rotateY(90deg) scale(0.5);opacity:0;}
}
.book-open{animation:bookOpen 0.6s ease-out forwards;transform-origin:left center;display:inline-block;font-size:52px;}
.book-close{animation:bookClose 0.5s ease-in forwards;transform-origin:left center;display:inline-block;font-size:52px;}
.welcome-text{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:8px;}

.sale-box{background:rgba(74,144,217,0.03);border:1px solid rgba(74,144,217,0.06);border-radius:12px;padding:12px 16px;margin:12px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.sale-box .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
.sale-box .val{font-family:'Baloo 2',sans-serif;font-size:20px;color:var(--text);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal-card{background:var(--card-bg);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:400px;max-width:92vw;transition:all 0.4s ease;}
.modal-card h3{font-size:18px;margin-bottom:10px;color:var(--text);}
.modal-actions{display:flex;gap:10px;margin-top:14px;}
.modal-actions .btn{flex:1;}
.user-info{display:flex;align-items:center;gap:10px;}
.user-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);overflow:hidden;flex-shrink:0;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-name{font-size:13px;font-weight:500;color:var(--text);}
.user-role{font-size:10px;color:var(--text-muted);}
.empty{color:var(--text-muted);padding:16px;text-align:center;font-size:13px;}
.msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;}
.msg-ok{background:rgba(46,204,113,0.05);color:#2ECC71;border:1px solid rgba(46,204,113,0.08);}
.msg-warn{background:rgba(231,76,60,0.05);color:#E74C3C;border:1px solid rgba(231,76,60,0.08);}
.search-wrapper{position:relative;}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card-bg);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:10px;max-height:180px;overflow-y:auto;z-index:10;display:none;margin-top:4px;transition:all 0.4s ease;}
.search-dropdown.show{display:block;}
.search-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:all 0.15s;font-size:13px;color:var(--text-secondary);}
.search-item:hover{background:rgba(74,144,217,0.05);color:var(--text);}
.search-item .art{color:var(--primary);font-weight:600;}
.chart-box{height:200px;position:relative;}
.logout-btn{background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text-secondary);padding:6px 14px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;transition:all 0.3s;}
.logout-btn:hover{background:rgba(231,76,60,0.05);border-color:rgba(231,76,60,0.15);color:#E74C3C;}
.actions{display:flex;gap:4px;flex-wrap:wrap;}

/* ============ SETTINGS ============ */
.theme-options{display:flex;gap:8px;flex-wrap:wrap;}
.theme-options button{padding:8px 16px;border:2px solid var(--border);border-radius:10px;background:transparent;color:var(--text-secondary);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;transition:all 0.3s;font-weight:500;}
.theme-options button:hover{border-color:var(--primary);color:var(--text);}
.theme-options button.active{border-color:var(--primary);background:rgba(74,144,217,0.08);color:var(--primary);}
.icon-options{display:flex;gap:8px;flex-wrap:wrap;}
.icon-options button{padding:8px 14px;border:2px solid var(--border);border-radius:10px;background:transparent;cursor:pointer;font-size:22px;transition:all 0.3s;}
.icon-options button:hover{border-color:var(--primary);transform:scale(1.05);}
.icon-options button.active{border-color:var(--primary);background:rgba(74,144,217,0.08);}
.flag-select{display:flex;gap:6px;align-items:center;}
.flag-select button{padding:4px 10px;border:2px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:16px;transition:all 0.3s;}
.flag-select button:hover{border-color:var(--primary);}
.flag-select button.active{border-color:var(--primary);background:rgba(74,144,217,0.08);}
</style>
</head>

<div id="app"><div class="loading">Yuklanmoqda</div></div>

<script>
// ============ KONFIG ============
const API_URL = '/api';
let token = localStorage.getItem('token');

// ============ TILLAR ============
const LANG = {
  uz: { hello: 'Salom', goodbye: 'Hayr', login: 'Kirish', logout: 'Chiqish', customers: 'Mijozlar', products: 'Mahsulotlar', sales: 'Sotuv', stats: 'Statistika', history: 'Tarix', settings: 'Sozlamalar', admin: 'Admin', user: 'Xodim', add: 'Qo\'shish', delete: 'O\'chirish', edit: 'Tahrirlash', save: 'Saqlash', cancel: 'Bekor qilish', debt: 'Qarz', paid: 'To\'langan', total: 'Jami', last: 'Oxirgi mahsulot', theme: 'Dizayn', light: 'Yorug\'', dark: 'Qorong\'i', classic: 'Klassik', icon: 'Belgi', select_date: 'Sana tanlang', show: 'Ko\'rsatish' },
  ru: { hello: 'Привет', goodbye: 'До свидания', login: 'Войти', logout: 'Выйти', customers: 'Клиенты', products: 'Товары', sales: 'Продажи', stats: 'Статистика', history: 'История', settings: 'Настройки', admin: 'Админ', user: 'Сотрудник', add: 'Добавить', delete: 'Удалить', edit: 'Редактировать', save: 'Сохранить', cancel: 'Отмена', debt: 'Долг', paid: 'Оплачено', total: 'Итого', last: 'Последний товар', theme: 'Дизайн', light: 'Светлый', dark: 'Тёмный', classic: 'Классический', icon: 'Иконка', select_date: 'Выберите дату', show: 'Показать' },
  en: { hello: 'Hello', goodbye: 'Goodbye', login: 'Login', logout: 'Logout', customers: 'Customers', products: 'Products', sales: 'Sales', stats: 'Statistics', history: 'History', settings: 'Settings', admin: 'Admin', user: 'Staff', add: 'Add', delete: 'Delete', edit: 'Edit', save: 'Save', cancel: 'Cancel', debt: 'Debt', paid: 'Paid', total: 'Total', last: 'Last Product', theme: 'Theme', light: 'Light', dark: 'Dark', classic: 'Classic', icon: 'Icon', select_date: 'Select date', show: 'Show' }
};
let lang = localStorage.getItem('lang') || 'uz';
function t(k){ return LANG[lang][k] || k; }

// ============ THEME ============
let currentTheme = localStorage.getItem('theme') || 'dark';
let currentIcon = localStorage.getItem('icon') || '📖';

function applyTheme(theme) {
  document.body.className = theme || currentTheme;
}

function applyIcon(icon) {
  document.querySelectorAll('.app-icon').forEach(el => el.textContent = icon || currentIcon);
}

// ============ STATE ============
let state = {
  loaded: false, loading: false,
  users: [], customers: [], products: [], sales: [], payments: [],
  currentUser: null, view: 'mijozlar', loginErr: '', error: null, payModal: null,
  saleDraft: { sana: '', productId: '', customerId: '', soni: '', tolangan: '' },
  historyFilter: { sana: '', customerId: '' },
  searchResults: [], showSearch: false, searchQuery: '',
  settings: { avatar: localStorage.getItem('user_avatar') || '' },
  showWelcome: false,
  isLoggingOut: false,
  statsFilter: { sana: '' }
};

// ============ API ============
async function apiRequest(endpoint, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    const res = await fetch(API_URL + endpoint, { ...opts, headers });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error || 'Xatolik '+res.status); }
    return res.json();
  } catch(e) { if(e.message.includes('Failed to fetch')) throw new Error('Serverga ulanish yo\'q'); throw e; }
}

async function loginUser(l,p){ const d=await apiRequest('/auth/login',{method:'POST',body:JSON.stringify({login:l,password:p})}); token=d.token; localStorage.setItem('token',token); return d.user; }
async function getCurrentUser(){ if(!token) return null; return apiRequest('/auth/me'); }
async function getCustomers(){ return apiRequest('/customers'); }
async function addCustomer(n,p){ return apiRequest('/customers',{method:'POST',body:JSON.stringify({name:n,phone:p})}); }
async function updateCustomer(id,n,p){ return apiRequest('/customers/'+id,{method:'PUT',body:JSON.stringify({name:n,phone:p})}); }
async function deleteCustomer(id){ return apiRequest('/customers/'+id,{method:'DELETE'}); }
async function getProducts(){ return apiRequest('/products'); }
async function searchProducts(q){ if(!q||q.length<1) return getProducts(); return apiRequest('/products/search/'+encodeURIComponent(q)); }
async function addProduct(n,pr){ return apiRequest('/products',{method:'POST',body:JSON.stringify({name:n,narx:pr})}); }
async function updateProduct(id,n,pr){ return apiRequest('/products/'+id,{method:'PUT',body:JSON.stringify({name:n,narx:pr})}); }
async function deleteProduct(id){ return apiRequest('/products/'+id,{method:'DELETE'}); }
async function getSales(){ return apiRequest('/sales'); }
async function addSale(d){ return apiRequest('/sales',{method:'POST',body:JSON.stringify(d)}); }
async function updateSale(id,d){ return apiRequest('/sales/'+id,{method:'PUT',body:JSON.stringify(d)}); }
async function deleteSale(id){ return apiRequest('/sales/'+id,{method:'DELETE'}); }
async function getPayments(){ return apiRequest('/payments'); }
async function addPayment(cid,s,a){ return apiRequest('/payments',{method:'POST',body:JSON.stringify({customerId:cid,sana:s,amount:a})}); }
async function getUsers(){ return apiRequest('/users'); }
async function registerUser(l,p,r){ return apiRequest('/users/register',{method:'POST',body:JSON.stringify({login:l,password:p,role:r||'user'})}); }
async function deleteUser(l){ return apiRequest('/users/'+l,{method:'DELETE'}); }

function fmt(n){ return Math.round(n||0).toLocaleString('ru-RU'); }
function today(){ return new Date().toISOString().slice(0,10); }

function getCustomerDebt(customerId) {
  if (!customerId) return 0;
  const sales = state.sales.filter(s => s.customerId === customerId);
  const totalDebt = sales.reduce((a,s) => a + (s.qarz||0), 0);
  const payments = state.payments.filter(p => p.customerId === customerId);
  const totalPaid = payments.reduce((a,p) => a + p.amount, 0);
  return Math.max(0, totalDebt - totalPaid);
}

// SANA BO'YICHA QARZ
function getDebtByDate(customerId, sana) {
  if (!customerId || !sana) return 0;
  const sales = state.sales.filter(s => s.customerId === customerId && s.sana === sana);
  const totalDebt = sales.reduce((a,s) => a + (s.qarz||0), 0);
  const payments = state.payments.filter(p => p.customerId === customerId && p.sana === sana);
  const totalPaid = payments.reduce((a,p) => a + p.amount, 0);
  return Math.max(0, totalDebt - totalPaid);
}

function computeSale(d) {
  const product = state.products.find(p => p._id === d.productId);
  const jami = product && d.soni ? product.narx * Number(d.soni) : 0;
  const tolangan = Number(d.tolangan || 0);
  const qarz = Math.max(0, jami - tolangan);
  const ortiqcha = Math.max(0, tolangan - jami);
  const oldDebt = d.customerId ? getCustomerDebt(d.customerId) : 0;
  return { product, jami, tolangan, qarz, ortiqcha, oldDebt, debtAfter: Math.max(0, oldDebt - ortiqcha) };
}

function render() {
  const app = document.getElementById('app');
  if (state.loading) { app.innerHTML = '<div class="loading">Yuklanmoqda</div>'; return; }
  if (!state.loaded) { app.innerHTML = '<div class="loading">Ma\'lumotlar yuklanmoqda</div>'; return; }
  if (!state.currentUser) { app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if (state.error) { app.innerHTML = '<div style="padding:40px;text-align:center;color:#E74C3C;"><h3>Xatolik</h3><p>'+state.error+'</p><button class="btn btn-primary" onclick="location.reload()">Qayta yuklash</button></div>'; return; }
  
  if (state.isLoggingOut) {
    app.innerHTML = renderLogoutAnimation();
    return;
  }
  
  if (state.showWelcome) {
    app.innerHTML = renderWelcome();
    setTimeout(() => { state.showWelcome = false; render(); }, 2000);
    return;
  }
  
  app.innerHTML = renderShell();
  attachShellEvents();
  if (state.view === 'statistika') setTimeout(drawCharts, 300);
  
  applyTheme(currentTheme);
  applyIcon(currentIcon);
}

      </div>` 
      : '<div class="empty">Ma\'lumot topilmadi</div>') 
    : '<div class="empty">Mijoz tanlang</div>'}
  </div>`;
}

// ============ CHARTS ============
let charts = [];
function drawCharts() {
  if (state.view !== 'statistika') return;
  charts.forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = [];
  
  // Daily
  const byDay = {};
  state.sales.forEach(s => { byDay[s.sana] = (byDay[s.sana] || 0) + s.jami; });
  const days = Object.keys(byDay).sort();
  const dc = document.getElementById('chartDaily');
  if (dc && days.length) {
    charts.push(new Chart(dc, {
      type: 'line',
      data: { labels: days, datasets: [{ label: 'Savdo', data: days.map(d=>byDay[d]), borderColor: '#4A90D9', backgroundColor: 'rgba(74,144,217,0.05)', fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    }));
  }
  
  // Products
  const byProd = {};
  state.sales.forEach(s => {
    const p = state.products.find(x => x._id === s.productId);
    const name = p ? p.name : '—';
    byProd[name] = (byProd[name] || 0) + s.soni;
  });
  const pc = document.getElementById('chartProducts');
  if (pc) {
    const labels = Object.keys(byProd);
    if (labels.length) {
      charts.push(new Chart(pc, {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Dona', data: labels.map(l=>byProd[l]), backgroundColor: ['#4A90D9','#2ECC71','#F39C12','#E74C3C','#9B59B6'] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      }));
    }
  }
}

// ============ EVENTS ============
function attachViewEvents() {
  // Customers
  document.getElementById('customerForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    if (!name) return;
    try { await addCustomer(name, phone); await loadData(); render(); } catch(err) { alert(err.message); }
  });
  
  document.querySelectorAll('[data-del-customer]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('O\'chirish?')) return;
      try { await deleteCustomer(this.dataset.delCustomer); await loadData(); render(); } catch(err) { alert(err.message); }
    });
  });
  
  document.querySelectorAll('[data-pay]').forEach(btn => {
    btn.addEventListener('click', function() {
      state.payModal = { customerId: this.dataset.pay };
      renderPayModal();
    });
  });
  
  // Products
  document.getElementById('productForm')?.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('prodName').value.trim();
    const narx = Number(document.getElementById('prodNarx').value);
    if (!name || !narx) return;
    try {
      const r = await addProduct(name, narx);
      alert('✅ Mahsulot qo\'shildi!\nArtikul: '+r.artikul+'\nNomi: '+r.name+'\nNarxi: '+fmt(r.narx)+' so\'m');
      await loadData(); render();
    } catch(err) { alert(err.message); }
  });
  
  document.querySelectorAll('[data-del-product]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('O\'chirish?')) return;
      try { await deleteProduct(this.dataset.delProduct); await loadData(); render(); } catch(err) { alert(err.message); }
    });
  });
  
  document.querySelectorAll('[data-last]').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.last;
      const p = state.products.find(x => x._id === id);
      if (p) { state.saleDraft.productId = p._id; state.view = 'sotuv'; state.searchQuery = p.artikul + ' - ' + p.name; render(); }
    });
  });
  
  // Sales
  const saleForm = document.getElementById('saleForm');
  if (saleForm) {
    const searchInput = document.getElementById('saleSearch');
    const productHidden = document.getElementById('saleProduct');
    
    document.getElementById('lastBtn')?.addEventListener('click', function() {
      if (state.products.length === 0) { alert('Mahsulot yo\'q!'); return; }
      const last = state.products[state.products.length - 1];
      state.saleDraft.productId = last._id;
      if (searchInput) searchInput.value = last.artikul + ' - ' + last.name;
      if (productHidden) productHidden.value = last._id;
      render();
      setTimeout(() => {
        const ev = new Event('input');
        document.getElementById('saleSoni')?.dispatchEvent(ev);
      }, 100);
    });
    
    if (searchInput) {
      let timeout;
      searchInput.addEventListener('input', async function() {
        const q = this.value.trim();
        state.searchQuery = q;
        clearTimeout(timeout);
        timeout = setTimeout(async () => {
          if (q.length > 0) {
            try { const r = await searchProducts(q); state.searchResults = r; state.showSearch = r.length > 0; render(); } catch(e) {}
          } else { state.searchResults = []; state.showSearch = false; render(); }
        }, 300);
      });
      
      document.addEventListener('click', function(e) {
        const item = e.target.closest('.search-item');
        if (item) {
          const pid = item.dataset.pid;
          const pname = item.dataset.pname;
          const part = item.dataset.part;
          if (productHidden) productHidden.value = pid;
          searchInput.value = part + ' - ' + pname;
          state.searchResults = []; state.showSearch = false; state.searchQuery = '';
          state.saleDraft.productId = pid;
          render();
          setTimeout(() => { const ev = new Event('input'); document.getElementById('saleSoni')?.dispatchEvent(ev); }, 100);
        }
      });
    }
    
    const updateSale = () => {
      state.saleDraft = {
        sana: document.getElementById('saleSana').value,
        customerId: document.getElementById('saleCustomer').value,
        productId: document.getElementById('saleProduct').value,
        soni: document.getElementById('saleSoni').value,
        tolangan: document.getElementById('saleTolangan').value
      };
      const f = computeSale(state.saleDraft);
      document.getElementById('saleJami').textContent = fmt(f.jami) + " so'm";
      document.getElementById('salePer').textContent = (f.product ? fmt(f.product.narx) : 0) + " so'm";
      const q = document.getElementById('saleQarz');
      q.value = fmt(f.qarz) + " so'm";
      q.style.background = f.qarz > 0 ? 'rgba(231,76,60,0.05)' : 'rgba(46,204,113,0.05)';
      q.style.color = f.qarz > 0 ? '#E74C3C' : '#2ECC71';
      q.style.borderColor = f.qarz > 0 ? 'rgba(231,76,60,0.1)' : 'rgba(46,204,113,0.1)';
    };
    
    ['saleSana','saleCustomer','saleSoni','saleTolangan'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener(el.tagName==='SELECT'||el.type==='date'?'change':'input', updateSale);
    });
    
    saleForm.addEventListener('submit', async e => {
      e.preventDefault();
      const d = state.saleDraft;
      if (!d.customerId || !d.productId || !d.soni || Number(d.soni)<=0) {
        alert('Mijoz, mahsulot va sonini to\'g\'ri kiriting!');
        return;
      }
      try {
        const r = await addSale({
          sana: d.sana || today(),
          customerId: d.customerId,
          productId: d.productId,
          soni: Number(d.soni),
          tolangan: Number(d.tolangan || 0)
        });
        state.saleDraft = { sana: today(), productId: '', customerId: '', soni: '', tolangan: '' };
        state.searchQuery = ''; state.searchResults = []; state.showSearch = false;
        if (searchInput) searchInput.value = '';
        if (productHidden) productHidden.value = '';
        await loadData(); render();
        alert('✅ Sotuv saqlandi!\nJami: '+fmt(r.jami)+' so\'m\nQarz: '+fmt(r.qarz)+' so\'m');
      } catch(err) { alert(err.message); }
    });
  }
  
  // History
  document.getElementById('histShow')?.addEventListener('click', function() {
    state.historyFilter = {
      sana: document.getElementById('histSana').value,
      customerId: document.getElementById('histCustomer').value
    };
    render();
  });
  
  document.getElementById('histClear')?.addEventListener('click', function() {
    document.getElementById('histSana').value = '';
    document.getElementById('histCustomer').value = '';
    state.historyFilter = { sana: '', customerId: '' };
    render();
  });
  
  // History - Edit & Delete
  document.querySelectorAll('[data-edit-sale]').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.editSale;
      const sale = state.sales.find(s => s._id === id);
      if (sale) {
        // Tahrirlash modalini ochish
        alert('Tahrirlash funksiyasi: ' + id + '\nJami: ' + fmt(sale.jami) + ' so\'m');
      }
    });
  });
  
  document.querySelectorAll('[data-del-sale]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('Sotuvni o\'chirish?')) return;
      try {
        await deleteSale(this.dataset.delSale);
        await loadData();
        render();
      } catch(err) { alert(err.message); }
    });
  });
  
  // Settings
  document.getElementById('avatarForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    const url = document.getElementById('avatarUrl').value.trim();
    if (url) { state.settings.avatar = url; localStorage.setItem('user_avatar', url); render(); }
  });
  
  document.getElementById('userForm')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    const login = document.getElementById('newLogin').value.trim();
    const password = document.getElementById('newParol').value;
    if (!login || !password) return;
    try {
      await registerUser(login, password);
      await loadData();
      render();
    } catch(err) { alert(err.message); }
  });
  
  document.querySelectorAll('[data-del-user]').forEach(btn => {
    btn.addEventListener('click', async function() {
      if (!confirm('O\'chirish?')) return;
      try { await deleteUser(this.dataset.delUser); await loadData(); render(); } catch(err) { alert(err.message); }
    });
  });
  
  // Stats - Sana bo'yicha qarz
  document.getElementById('statsShowBtn')?.addEventListener('click', function() {
    state.statsFilter.sana = document.getElementById('statsDate').value;
    render();
  });
  
  document.getElementById('statsClearBtn')?.addEventListener('click', function() {
    document.getElementById('statsDate').value = '';
    state.statsFilter.sana = '';
    render();
  });
  
  // Theme
  document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', function() {
      currentTheme = this.dataset.theme;
      localStorage.setItem('theme', currentTheme);
      document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      applyTheme(currentTheme);
      render();
    });
  });
  
  document.querySelectorAll('[data-icon]').forEach(btn => {
    btn.addEventListener('click', function() {
      currentIcon = this.dataset.icon;
      localStorage.setItem('icon', currentIcon);
      document.querySelectorAll('[data-icon]').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      applyIcon(currentIcon);
      render();
    });
  });
}

// ============ PAY MODAL ============
function renderPayModal() {
  const c = state.customers.find(x => x._id === state.payModal.customerId);
  if (!c) return;
  const debt = getCustomerDebt(c._id);
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'payOverlay';
  overlay.innerHTML = `
    <div class="modal-card glass">
      <h3>💰 Qarz to'lash — ${c.name}</h3>
      <p style="color:var(--text-secondary);font-size:14px;margin-top:-6px;">Joriy qarz: <b style="color:#E74C3C;">${fmt(debt)} so'm</b></p>
      <form id="payForm">
        <div class="field"><label>Sana</label><input type="date" id="paySana" value="${today()}"></div>
        <div class="field"><label>To'lov summasi (so'm)</label><input type="number" min="1" max="${debt}" id="payAmount" required placeholder="0"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="payCancel">Bekor qilish</button>
          <button type="submit" class="btn btn-primary">Saqlash</button>
        </div>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);
  
  document.getElementById('payCancel').addEventListener('click', function() {
    document.getElementById('payOverlay').remove();
    state.payModal = null;
  });
  
  document.getElementById('payOverlay').addEventListener('click', function(e) {
    if (e.target === this) { this.remove(); state.payModal = null; }
  });
  
  document.getElementById('payForm').addEventListener('submit', async e => {
    e.preventDefault();
    const sana = document.getElementById('paySana').value || today();
    const amount = Number(document.getElementById('payAmount').value);
    if (!amount || amount <= 0) return;
    try {
      await addPayment(state.payModal.customerId, sana, amount);
      document.getElementById('payOverlay').remove();
      state.payModal = null;
      await loadData();
      render();
      alert('✅ To\'lov saqlandi!\nSana: '+sana+'\nSumma: '+fmt(amount)+' so\'m');
    } catch(err) { alert(err.message); }
  });
}

// ============ CHANGE LANG ============
function changeLang(l) { 
  lang = l; 
  localStorage.setItem('lang', lang); 
  render(); 
}
window.changeLang = changeLang;

// ============ LOAD DATA ============
async function loadData() {
  try {
    state.loading = true;
    const [customers, products, sales, payments, users] = await Promise.all([
      getCustomers().catch(()=>[]),
      getProducts().catch(()=>[]),
      getSales().catch(()=>[]),
      getPayments().catch(()=>[]),
      getUsers().catch(()=>[])
    ]);
    state.customers = customers;
    state.products = products;
    state.sales = sales;
    state.payments = payments;
    state.users = users;
    state.loaded = true;
    state.loading = false;
    state.error = null;
  } catch(err) {
    state.loading = false;
    state.error = err.message;
    render();
  }
}

// ============ INIT ============
(async function init() {
  try {
    const savedToken = localStorage.getItem('token');
    if (savedToken) {
      token = savedToken;
      try {
        const user = await getCurrentUser();
        if (user) {
          state.currentUser = user;
          await loadData();
          state.loaded = true;
          render();
          return;
        }
      } catch(e) {
        localStorage.removeItem('token');
        token = null;
        state.currentUser = null;
      }
    }
    state.loaded = true;
    render();
  } catch(e) {
    state.loaded = true;
    render();
  }
})();
</script>
